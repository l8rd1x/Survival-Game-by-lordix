<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>ДОИСТОРИЧЕСКИЕ ВРЕМЕНА — АФРИКА</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;position:fixed;inset:0;
    overscroll-behavior:none;touch-action:none;font-family:Georgia,'Times New Roman',serif}
  /* Корневой контейнер игры: при вертикальном положении телефона JS поворачивает его на 90° */
  #app{position:absolute;left:0;top:0;width:100vw;height:100vh;overflow:hidden;background:#000;transform-origin:0 0}
  #gl{position:absolute;left:0;top:0;width:100%;height:100%;display:block;z-index:1;touch-action:none}

  /* ---------- ЗАСТАВКА ---------- */
  #splash{position:absolute;inset:0;background:#000;z-index:30;display:flex;align-items:center;justify-content:center;
    opacity:1;transition:opacity .8s ease}
  #splash.hide{opacity:0;pointer-events:none}
  #logo{font-size:clamp(56px,20vmin,170px);font-weight:900;letter-spacing:.12em;padding-left:.12em;
    background:linear-gradient(180deg,#fff4b8 0%,#ffcc3d 45%,#c98a10 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 14px rgba(255,150,20,.95)) drop-shadow(0 0 38px rgba(255,100,0,.65));
    animation:pulse 1.1s ease-in-out 3;will-change:transform}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

  /* ---------- МЕНЮ ---------- */
  #menu{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2.2vmin;text-align:center;padding:2vmin;
    background:radial-gradient(circle at 50% 108%,rgba(255,214,120,.55),rgba(255,214,120,0) 55%),
               linear-gradient(165deg,#2b1205 0%,#6d3410 38%,#c4701b 76%,#efb04e 100%)}
  .mTitle{font-size:min(9vmin,64px);font-weight:900;letter-spacing:.06em;color:#ffe5a8;
    text-shadow:0 3px 0 #5a2a08,0 0 24px rgba(255,170,60,.55)}
  .mSub{font-size:min(5vmin,34px);letter-spacing:.35em;color:#ffcf7a;margin-bottom:2vmin;text-shadow:0 2px 0 #4a2006}
  .mBtn{font-family:inherit;font-size:min(5.6vmin,34px);font-weight:700;letter-spacing:.18em;color:#fff1cc;
    width:min(70vmin,420px);padding:2.2vmin 3vmin;border-radius:16px;border:3px solid #ffd27a;
    background:linear-gradient(180deg,#9a5420,#5b2c0c);box-shadow:0 6px 0 #2e1405,0 10px 24px rgba(0,0,0,.4);cursor:pointer;
    transition:transform .08s}
  .mBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #2e1405}
  .mCol{display:flex;flex-direction:column;align-items:center;gap:2.2vmin}
  .mBtn:disabled{opacity:.4;filter:grayscale(.6);cursor:default}
  .mBtn:disabled:active{transform:none;box-shadow:0 6px 0 #2e1405,0 10px 24px rgba(0,0,0,.4)}
  #loadMsg{color:#ffe0a0;font-size:min(3.4vmin,16px);min-height:1.2em;max-width:80%}

  /* ---------- НАСТРОЙКИ ГРАФИКИ ---------- */
  #settings{position:absolute;inset:0;z-index:25;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:1.3vmin;padding:1.5vmin 2vmin;text-align:center;
    background:radial-gradient(circle at 50% 108%,rgba(255,214,120,.55),rgba(255,214,120,0) 55%),
               linear-gradient(165deg,#2b1205 0%,#6d3410 38%,#c4701b 76%,#efb04e 100%)}
  #settings.on{display:flex}
  .sTitle{font-size:min(6vmin,38px);font-weight:900;letter-spacing:.1em;color:#ffe5a8;text-shadow:0 2px 0 #5a2a08,0 0 18px rgba(255,170,60,.5)}
  .sRow{display:flex;gap:1.2vmin;width:min(150vmin,860px)}
  .sGrid{display:grid;grid-template-columns:1fr 1fr;gap:1.2vmin 1.6vmin;width:min(150vmin,860px)}
  .sBtn{font-family:inherit;color:#fff1cc;border:2px solid #ffd27a;border-radius:12px;cursor:pointer;
    background:linear-gradient(180deg,#9a5420,#5b2c0c);box-shadow:0 3px 0 #2e1405;
    padding:0 1.6vmin;height:min(8.4vmin,50px);font-size:min(3.4vmin,19px);font-weight:700;
    display:flex;align-items:center;justify-content:space-between;gap:1vmin;white-space:nowrap}
  .sBtn b{color:#ffd966;font-weight:900}
  .sBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #2e1405}
  .sPre{flex:1;justify-content:center;letter-spacing:.05em}
  .sPre.on{background:linear-gradient(180deg,#f2b83e,#b8741a);color:#3a1f0a;border-color:#fff1b0}
  #sNote{color:#ffe0a0;font-size:min(2.9vmin,14px);min-height:1.2em;max-width:92%}
  #fpsBox{position:absolute;left:calc(8px + env(safe-area-inset-left));top:calc(8px + env(safe-area-inset-top));z-index:8;
    pointer-events:none;display:none;font:700 13px/1 monospace;color:#c8ffa8;background:rgba(0,0,0,.55);padding:5px 8px;border-radius:8px}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;z-index:5;display:none;pointer-events:none}
  #vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(35,12,0,.55) 100%)}
  #zoneMove{position:absolute;left:0;bottom:0;width:50%;height:70%;pointer-events:auto;touch-action:none}
  #zoneCam{position:absolute;right:0;top:0;width:50%;height:100%;pointer-events:auto;touch-action:none}
  #joyBase{position:absolute;width:120px;height:120px;border-radius:50%;display:none;pointer-events:none;
    border:3px solid rgba(255,255,255,.55);background:radial-gradient(circle,rgba(255,255,255,.14),rgba(0,0,0,.28))}
  #joyKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff3a8,#f2b61a 55%,#9a6200);
    box-shadow:0 2px 8px rgba(0,0,0,.5);will-change:transform}
  #topBtns{position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));
    display:flex;gap:8px;z-index:6;pointer-events:auto}
  .hBtn{font-family:inherit;font-size:15px;color:#ffe6b0;padding:8px 12px;border-radius:12px;cursor:pointer;
    background:rgba(40,20,5,.65);border:2px solid rgba(255,210,120,.85)}
  .hBtn:active{background:rgba(120,60,10,.8)}

  #toast{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);z-index:7;pointer-events:none;opacity:0;transition:opacity .3s;
    background:rgba(30,14,4,.8);color:#ffe6b0;border:2px solid rgba(255,210,120,.8);border-radius:12px;padding:8px 14px;font-size:15px;white-space:nowrap}
  #actBtns{position:absolute;right:calc(16px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));width:0;height:0;z-index:6;pointer-events:none}
  .rBtn{position:absolute;border-radius:50%;border:3px solid #ffd27a;color:#fff1cc;font-family:inherit;padding:0;cursor:pointer;pointer-events:auto;touch-action:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 28%,#c27a35,#6a3410 72%);box-shadow:0 5px 0 #2e1405,0 8px 18px rgba(0,0,0,.45)}
  .rBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #2e1405,0 4px 10px rgba(0,0,0,.4)}
  #bThrow{right:0;bottom:6px;width:90px;height:90px;font-size:40px;background:radial-gradient(circle at 35% 28%,#d8643a,#7a2410 72%)}
  #bSprint{right:104px;bottom:8px;width:64px;height:64px;font-size:28px}
  #bSprint.on{background:radial-gradient(circle at 35% 28%,#ffe08a,#e39b1a 72%);color:#3a1f0a;box-shadow:0 0 0 3px rgba(255,200,80,.5),0 0 22px rgba(255,170,30,.9),0 3px 0 #6a3a08}
  #bPick{display:none;right:12px;bottom:108px;width:74px;height:74px}
  #bPick svg{width:38px;height:38px;margin-top:-2px}
  #bPick small{font-size:10px;line-height:1;margin-top:-1px;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #bDrink{display:none;right:96px;bottom:88px;width:62px;height:62px;font-size:28px;background:radial-gradient(circle at 35% 28%,#4aa6d8,#17476a 72%)}
  #placeBar{position:absolute;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:8;display:none;gap:6px;pointer-events:auto;
    background:rgba(30,14,4,.72);border:2px solid rgba(255,210,120,.85);border-radius:14px;padding:6px}
  .pb{font-family:inherit;font-size:20px;min-width:44px;height:44px;padding:0 8px;border-radius:10px;border:2px solid #ffd27a;color:#fff1cc;cursor:pointer;touch-action:none;
    background:linear-gradient(180deg,#9a5420,#5b2c0c)}
  .pb:active{transform:translateY(2px)} .pb.ok{background:linear-gradient(180deg,#3fa04a,#1d5c25)} .pb.no{background:linear-gradient(180deg,#c24a3a,#7a2016)}
  #bSleep{display:none;right:100px;bottom:158px;width:62px;height:62px;font-size:28px;background:radial-gradient(circle at 35% 28%,#8a7ad8,#2e2468 72%)}
  #coldOv{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:4;background:radial-gradient(ellipse at center,rgba(40,90,160,0) 35%,rgba(60,130,210,.75) 100%)}
  #sleepOv{position:absolute;inset:0;z-index:9;background:#02030a;opacity:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#cdd8ff;font-size:24px;transition:opacity .9s}
  #sleepOv.on{opacity:.95;pointer-events:auto} #sleepOv small{font-size:14px;opacity:.8}
  #hurtOv{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:4;background:radial-gradient(ellipse at center,rgba(120,0,0,0) 38%,rgba(160,0,0,.8) 100%)}
  .clk b{font-size:14px;color:#fff6dc;text-shadow:0 1px 3px #000;letter-spacing:.5px}
  .dbar{position:absolute;left:4px;right:4px;bottom:3px;height:5px;background:rgba(0,0,0,.55);border-radius:3px;overflow:hidden}
  .dbar i{display:block;height:100%}
  #stats{position:absolute;top:calc(10px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));z-index:6;pointer-events:none;
    display:flex;flex-direction:column;gap:5px}
  .st{display:flex;align-items:center;gap:6px;font-size:16px}
  .bar{width:min(26vmin,130px);height:11px;border:2px solid rgba(255,210,120,.85);border-radius:7px;background:rgba(30,14,4,.65);overflow:hidden}
  .bar i{display:block;height:100%;width:100%}
  .bar.low{animation:blink .9s infinite}
  @keyframes blink{50%{opacity:.35}}
  #sickOv{position:absolute;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse at center,rgba(70,120,20,.12) 20%,rgba(60,110,20,.7) 100%)}
  #dead{position:absolute;inset:0;z-index:18;display:none;flex-direction:column;align-items:center;justify-content:center;gap:3vmin;
    background:rgba(45,0,0,.75);color:#ffd2c0;font-size:min(8vmin,48px);font-weight:900;text-align:center;letter-spacing:.06em}
  #aimBar{position:absolute;left:50%;bottom:24%;width:min(40vmin,260px);height:12px;transform:translateX(-50%);z-index:7;pointer-events:none;
    display:none;overflow:hidden;border:2px solid rgba(255,210,120,.9);border-radius:8px;background:rgba(30,14,4,.7)}
  #aimFill{height:100%;width:0;background:linear-gradient(90deg,#d9531e,#ffd23a,#7ad13a)}
  #inv{position:absolute;inset:0;z-index:15;display:none;align-items:center;justify-content:center;background:rgba(10,4,0,.6)}
  #invBox{--c:min(10.5vmin,50px);background:linear-gradient(180deg,#5b3414,#3a1f0a);border:3px solid #ffd27a;border-radius:16px;padding:10px;color:#ffe6b0;max-width:98%;max-height:98%}
  #invTabs{display:flex;gap:8px;margin-bottom:8px}
  .tab,.sb{font-family:inherit;font-size:14px;color:#ffe6b0;background:rgba(0,0,0,.35);border:2px solid #c98a3a;border-radius:10px;padding:7px 12px;cursor:pointer}
  .tab.on{background:#c4701b}
  .sb:disabled{opacity:.4}
  #invBody{display:flex;gap:12px}
  #grid{position:relative;display:grid;grid-template-columns:repeat(6,var(--c));grid-template-rows:repeat(5,var(--c));gap:2px;flex:none}
  .cell{background:rgba(0,0,0,.35);border:1px solid rgba(255,210,120,.25)}
  .itm{position:absolute;border:2px solid rgba(255,230,160,.8);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:calc(var(--c)*.6)}
  .itm.sel{border-color:#fff;box-shadow:0 0 0 2px #ffb020,0 0 12px #ffb020;pointer-events:none}
  #side{width:min(60vmin,290px);font-size:13px;max-height:calc(var(--c)*5 + 8px);overflow-y:auto;overflow-x:hidden;touch-action:none;
    padding-right:6px;scrollbar-width:thin;scrollbar-color:#c98a3a rgba(0,0,0,.3)}
  #side::-webkit-scrollbar{width:6px} #side::-webkit-scrollbar-thumb{background:#c98a3a;border-radius:3px}
  .rcT{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .rcD{opacity:.85;font-size:12px;margin:2px 0}
  .rcM{font-size:12px} .ok{color:#a6e884} .no{color:#ff9d84}
  .rc{background:rgba(0,0,0,.3);border:1px solid #c98a3a;border-radius:10px;padding:7px 8px;margin-bottom:6px;line-height:1.4}
</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>

  <div id="hud">
    <div id="vignette"></div>
    <div id="fpsBox"></div>
    <div id="zoneMove"></div>
    <div id="zoneCam"></div>
    <div id="joyBase"><div id="joyKnob"></div></div>
    <div id="toast"></div>
    <div id="aimBar"><div id="aimFill"></div></div>
    <div id="stats">
      <div class="st"><span>❤️</span><div class="bar" id="bHp"><i id="sHp" style="background:#d93b2e"></i></div></div>
      <div class="st"><span>🍖</span><div class="bar" id="bFood"><i id="sFood" style="background:#e08a2a"></i></div></div>
      <div class="st"><span>💧</span><div class="bar" id="bWater"><i id="sWater" style="background:#3aa0d8"></i></div></div>
      <div class="st"><span>🌡️</span><div class="bar" id="bWarm"><i id="sWarm" style="background:#6cc8e8"></i></div></div>
      <div class="st" id="torchRow" style="display:none"><span>🔥</span><b id="torchT" style="color:#ffd9a0;font-size:13px"></b></div>
      <div class="st clk"><span id="clkI">☀️</span><b id="clkT">09:00</b><span id="clkW"></span></div>
    </div>
    <div id="sickOv"></div>
    <div id="hurtOv"></div>
    <div id="coldOv"></div>
    <div id="sleepOv"><div>😴 Ты спишь у костра…</div><small>Время идёт быстрее. Проснёшься утром</small><button id="bWake" class="mBtn">ПРОСНУТЬСЯ</button></div>
    <div id="placeBar">
      <button id="pL" class="pb" title="Повернуть влево">⟲</button>
      <button id="pR" class="pb" title="Повернуть вправо">⟳</button>
      <button id="p90" class="pb">90°</button>
      <button id="pNear" class="pb" title="Ближе">−</button>
      <button id="pFar" class="pb" title="Дальше">+</button>
      <button id="pOk" class="pb ok">✔</button>
      <button id="pNo" class="pb no">✖</button>
    </div>
    <div id="actBtns">
      <button id="bThrow" class="rBtn">🎯</button>
      <button id="bSprint" class="rBtn">🏃</button>
      <button id="bPick" class="rBtn"></button>
      <button id="bDrink" class="rBtn">💧</button>
      <button id="bSleep" class="rBtn">😴</button>
    </div>
    <div id="topBtns">
      <button id="btnView" class="hBtn">👁 1-е лицо</button>
      <button id="btnInv" class="hBtn">🎒 Рюкзак</button>
      <button id="btnGfx" class="hBtn" title="Настройки графики">⚙</button>
      <button id="btnFs" class="hBtn" title="Полный экран">⛶</button>
      <button id="btnMenu" class="hBtn" title="Сохранить и выйти в меню">☰</button>
    </div>
  </div>

  <div id="dead"><div>ВЫ ПОГИБЛИ</div><button id="bRespawn" class="mBtn">ВОЗРОДИТЬСЯ</button></div>

  <div id="inv"><div id="invBox">
    <div id="invTabs"><button class="tab on" data-t="bag">🎒 Рюкзак</button><button class="tab" data-t="craft">🔨 Крафт</button><button class="tab" id="invX" style="margin-left:auto">✕</button></div>
    <div id="invBody"><div id="grid"></div><div id="side"></div></div>
  </div></div>

  <div id="menu">
    <div class="mTitle">ДОИСТОРИЧЕСКИЕ ВРЕМЕНА</div>
    <div class="mSub">— АФРИКА —</div>
    <div id="menuMain" class="mCol">
      <button id="btnSingle" class="mBtn">ОДИНОЧНАЯ ИГРА</button>
      <button id="btnMulti" class="mBtn">МУЛЬТИПЛЕЕР</button>
    </div>
    <div id="menuMulti" class="mCol" style="display:none">
      <div class="mSub" style="font-size:min(3.6vmin,24px);letter-spacing:.2em">ВЫБОР СЕРВЕРА</div>
      <input id="mpNick" class="mBtn" maxlength="14" placeholder="ВАШ НИК" autocomplete="off" style="text-align:center;cursor:text;user-select:text;-webkit-user-select:text;letter-spacing:.08em">
      <div style="display:flex;gap:2vmin;width:min(70vmin,420px)"><button id="skD" class="mBtn" style="width:50%;font-size:min(3.4vmin,22px);letter-spacing:.04em;padding:2vmin 1vmin;background:#6b3a1a">ТЁМНАЯ КОЖА</button><button id="skL" class="mBtn" style="width:50%;font-size:min(3.4vmin,22px);letter-spacing:.04em;padding:2vmin 1vmin;background:#e0b08a;color:#3a2010">СВЕТЛАЯ КОЖА</button></div>
      <button id="btnServer" class="mBtn">🌍 АФРИКА · ОБЩИЙ</button>
      <button id="btnBackMulti" class="mBtn">НАЗАД</button>
    </div>
    <div id="menuSingle" class="mCol" style="display:none">
      <button id="btnContinue" class="mBtn" disabled>ПРОДОЛЖИТЬ</button>
      <button id="btnPlay" class="mBtn">НОВАЯ ИГРА</button>
      <button id="btnBackMain" class="mBtn">← НАЗАД</button>
    </div>
    <button id="btnSettings" class="mBtn">НАСТРОЙКИ</button>
    <div id="loadMsg"></div>
  </div>

  <div id="settings">
    <div class="sTitle">⚙ НАСТРОЙКИ ГРАФИКИ</div>
    <div class="sRow" id="sPresets"></div>
    <div class="sGrid" id="sGrid"></div>
    <div id="sNote"></div>
    <div class="sRow">
      <button id="sReload" class="sBtn sPre" style="display:none">↻ ПРИМЕНИТЬ И ПЕРЕЗАПУСТИТЬ</button>
      <button id="sBack" class="sBtn sPre">← НАЗАД</button>
    </div>
  </div>

  <div id="splash"><div id="logo">LORDIX</div></div>
</div>

<!-- Классический скрипт: заставка и мелочи работают, даже если Three.js не загрузился -->
<script>
(function(){
  var splash=document.getElementById('splash');
  // ~3.3 секунды пульсации, затем плавное исчезновение
  setTimeout(function(){
    splash.classList.add('hide');
    setTimeout(function(){ splash.style.display='none'; },900);
  },3300);
  document.getElementById('btnSettings').addEventListener('click',function(){ if(!window.__gameReady) alert('Игра ещё загружается, подождите пару секунд'); });
  setTimeout(function(){
    if(!window.__gameReady){
      document.getElementById('loadMsg').textContent='Не удалось загрузить Three.js. Проверьте интернет и обновите страницу.';
    }
  },9000);
  document.addEventListener('gesturestart',function(e){e.preventDefault();});
  document.addEventListener('contextmenu',function(e){e.preventDefault();});
  document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
})();
</script>

  projectId: "ВСТАВЬТЕ_PROJECT_ID",
  appId: "ВСТАВЬТЕ_APP_ID"
};
</script>

<script type="importmap">

const GROUND_SIZE = 390;
const WORLD_LIM   = GROUND_SIZE / 2 - 2;          // границы мира ±193
const LAKE        = { x: 45, z: -40, r: 16 };     // озеро
const WATER_Y     = -0.2;
/* ---- река: течёт с севера на юг, извивается; три брода ---- */
const FORDS = [-125, 18, 120];
const riverX  = z => -78 + 36*Math.sin(z*0.02+0.8) + 14*Math.sin(z*0.055+2.0);
const riverDX = z => 36*0.02*Math.cos(z*0.02+0.8) + 14*0.055*Math.cos(z*0.055+2.0);
const riverHW = z => 4.6 + 1.4*Math.sin(z*0.031+1.2);
const riverSd = (x,z) => Math.abs(x-riverX(z))/Math.sqrt(1+riverDX(z)**2) - riverHW(z);   // <0 — в воде
const lakeSd  = (x,z) => Math.hypot(x-LAKE.x, z-LAKE.z) - LAKE.r;
const waterSd = (x,z) => Math.min(lakeSd(x,z), riverSd(x,z));
function fordK(z){ let k=0; for(const zc of FORDS) k=Math.max(k,Math.exp(-(((z-zc)/10)**2))); return k; }
function waterGrad(x,z){ const e=.5, gx=waterSd(x+e,z)-waterSd(x-e,z), gz=waterSd(x,z+e)-waterSd(x,z-e), l=Math.hypot(gx,gz)||1; return {x:gx/l,z:gz/l}; }
// вытолкнуть объект из воды (брод проходим); m — желаемый зазор до воды (<0 — разрешено зайти вглубь)
function pushWater(o,m){
  if(lakeSd(o.x,o.z)<m){ const dx=o.x-LAKE.x, dz=o.z-LAKE.z, d=Math.hypot(dx,dz)||1, mn=LAKE.r+m; o.x=LAKE.x+dx/d*mn; o.z=LAKE.z+dz/d*mn; return; }
  if(riverSd(o.x,o.z)<m&&fordK(o.z)<.5){ const x0=riverX(o.z), side=o.x>=x0?1:-1, k=Math.sqrt(1+riverDX(o.z)**2); o.x=x0+side*(riverHW(o.z)+m)*k; }
}
const PLAYER_SPEED = 6;                           // units/sec
const HIP         = 0.99;                         // высота таза над землёй
const JOY_R       = 55;                           // радиус хода джойстика, px
// В three r155+ свет задаётся в физических единицах: умножаем на π,
// чтобы получить привычную яркость (интенсивности из ТЗ: 1.5 / 0.55 / 0.4)
const LK = Math.PI;

/* ============================================================
   НАСТРОЙКИ ГРАФИКИ / ОПТИМИЗАЦИЯ (пресеты + ручная настройка, сохраняются в браузере)

const GFX_KEY = 'lordix_gfx_v1';
const GFX_LV = {
  shadow : { names:['Выкл','Простые','Мягкие'] },
  res    : { names:['Низкое','Среднее','Высокое'], pr:[0.65, 1.0, 2.0] },
  grass  : { names:['Выкл','Мало','Средне','Много'], n:[0,1500,3000,5000] },
  tex    : { names:['Плавные','Средние','Чёткие'], an:[1,4,8] },

  terrain: { names:['Низкая','Средняя','Высокая'], seg: isMobile ? [80,120,170] : [100,150,230] },
  fpsCap : { names:['Без лимита','60','30'], v:[0,60,30] },
  aa     : { names:['Выкл','Вкл'] },
  fps    : { names:['Нет','Да'] },
  auto   : { names:['Выкл','Вкл'] },
};
const GFX_PRESETS = {
  high: { shadow:2, res:2, grass:3, tex:2, rain:2, terrain:2, aa:1, auto:1 },
  mid : { shadow:1, res:1, grass:2, tex:1, rain:2, terrain:1, aa:isMobile?0:1, auto:1 },
  low : { shadow:0, res:0, grass:1, tex:0, rain:1, terrain:0, aa:0, auto:0 },
};
const GFX_PRESET_NAMES = { high:'ВЫСОКОЕ', mid:'СРЕДНЕЕ', low:'МИНИМУМ' };
const GFX_MATCH = ['shadow','res','grass','tex','rain','terrain','aa'];
function gfxLoad(){
  const g = Object.assign({ fpsCap:0, fps:0 }, GFX_PRESETS[isMobile ? 'mid' : 'high']);
  try {
    const s = JSON.parse(localStorage.getItem(GFX_KEY) || 'null');
    if (s && typeof s === 'object') for (const k in g) if (typeof s[k] === 'number') g[k] = s[k];
  } catch(e){}
  for (const k in g){ const max = GFX_LV[k].names.length - 1; g[k] = Math.max(0, Math.min(max, g[k]|0)); }
  return g;
}
const GFX = gfxLoad();
const GFX_BUILT = { aa:GFX.aa, terrain:GFX.terrain };      // эти два пункта применяются только при запуске игры
function gfxSave(){ try { localStorage.setItem(GFX_KEY, JSON.stringify(GFX)); } catch(e){} }
function gfxPR(){ return Math.max(0.5, Math.min(window.devicePixelRatio || 1, GFX_LV.res.pr[GFX.res])); }
function gfxShadowSize(){ return GFX.shadow === 2 ? (isMobile ? 1536 : 2048) : 1024; }

// Детерминированный ГСЧ — мир одинаковый при каждом запуске
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry32(20240607);
const rr  = (a,b) => a + (b-a)*rnd();
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const smooth = (a,b,x) => { const t = clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
function lerpAngle(a,b,t){ let d=b-a; d=Math.atan2(Math.sin(d),Math.cos(d)); return a+d*t; }

/* ============================================================
   РЕЛЬЕФ (аналитическая функция — быстро и для земли, и для объектов)
   ============================================================ */
const HILLS=[[-40,95,26,6.5],[120,-110,30,8],[-150,40,22,5.5],[70,130,24,7],[-165,-140,22,6],[160,60,20,5]];
function reliefE(x,z){
  const wd=waterSd(x,z), r0=Math.hypot(x,z);
  const mask=smooth(6,26,wd)*smooth(10,32,r0);
  if(mask<=0) return 0;
  // барханы: изогнутые острые гребни
  const u=x*0.8+z*0.6+14*Math.sin(z*0.03), v=-x*0.6+z*0.8;
  const rid=1-Math.abs(Math.sin(u*0.032+1.6*Math.sin(v*0.016)));
  let e=Math.pow(rid,1.6)*1.7*(0.55+0.45*Math.sin(v*0.011+1));
  // плато-террасы (две ступени)
  const n=0.5+0.28*Math.sin(x*0.0105+1.3)*Math.sin(z*0.0125-0.4)+0.22*Math.sin((x+z)*0.0072+2.1);
  e+=3.4*smooth(0.62,0.70,n)+2.2*smooth(0.78,0.84,n);
  // скальные холмы с лопастями
  for(const h of HILLS){ const d2=((x-h[0])*(x-h[0])+(z-h[1])*(z-h[1]))/(h[2]*h[2]);
    if(d2<9) e+=h[3]*Math.exp(-d2*1.1)*(0.8+0.2*Math.sin(Math.atan2(z-h[1],x-h[0])*5)*Math.min(1,d2*4)); }
  // сухое русло (вади)
  const wx=112+22*Math.sin(z*0.026+0.5), wdi=Math.abs(x-wx);
  e-=2.4*Math.exp(-(wdi/7)*(wdi/7));
  return e*mask;
}
function baseH(x,z){ return baseH0(x,z)+reliefE(x,z); }
function baseH0(x,z){
  return Math.sin(x*0.045)*Math.cos(z*0.05)*0.22
       + Math.sin(x*0.13+z*0.09)*0.10
       + Math.cos(z*0.21-x*0.17)*0.06
       + Math.sin(x*0.5)*Math.sin(z*0.43)*0.04;       // итого ≈ ±0.4
}
function getH(x,z){
  const b = baseH(x,z);
  const hr = getH_river(x,z,b);
  const d = Math.hypot(x-LAKE.x, z-LAKE.z);
  if (d >= 26) return hr;
  const WL = -0.15;
  if (d < 15.5) return Math.min(hr, WL - Math.min((15.5-d)*0.09, 0.9));   // дно озера
  return Math.min(hr, WL + (b-WL)*smooth(15.5, 26, d));                    // пологий берег
}
function getH_river(x,z,b){
  const rd = riverSd(x,z);
  if (rd >= 10) return b;
  const WL = -0.15;
  if (rd < 0) return WL - Math.min(-rd*0.2, 0.6)*(1-0.7*fordK(z));   // дно реки (на броде мелко)
  return WL + (b-WL)*smooth(0, 10, rd);                                   // пологий берег
}

/* ============================================================

function makeCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return [c, c.getContext('2d')]; }
function toTex(c, rx=1, ry=1, wrap=true){
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  if (wrap){ t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  t.repeat.set(rx, ry);
  t.anisotropy = aniso;
  return t;
}

// Песок: 12000 песчинок, камешки, волнистые линии (след ветра)
function makeSandTexture(){
  const S = 512, [c,g] = makeCanvas(S*2,S*2); g.scale(2,2);
  g.fillStyle = '#e0c186'; g.fillRect(0,0,S,S);
  // мягкие пятна, нарисованы с обёрткой — текстура бесшовная
  for (let i=0;i<46;i++){
    const x=rnd()*S, y=rnd()*S, r=30+rnd()*70;
    const rgb = rnd()<0.5 ? '190,150,90' : '245,222,170';
    for (let ox=-S; ox<=S; ox+=S) for (let oy=-S; oy<=S; oy+=S){
      const gr = g.createRadialGradient(x+ox,y+oy,0,x+ox,y+oy,r);
      gr.addColorStop(0,`rgba(${rgb},0.12)`); gr.addColorStop(1,`rgba(${rgb},0)`);
      g.fillStyle = gr; g.fillRect(x+ox-r,y+oy-r,r*2,r*2);
    }
  }
  // волнистые линии на песке
  for (let i=0;i<18;i++){
    const y0=20+rnd()*(S-40), amp=2+rnd()*5, k=1+Math.floor(rnd()*4), ph=rnd()*6.28;
    g.strokeStyle = i%2 ? 'rgba(150,110,60,0.17)' : 'rgba(255,238,195,0.2)';
    g.lineWidth = 1+rnd()*1.5; g.beginPath();
    for (let x=0;x<=S;x+=8){
      const y = y0 + amp*Math.sin(2*Math.PI*k*x/S+ph) + 1.5*Math.sin(2*Math.PI*k*3*x/S+ph*2);
      x===0 ? g.moveTo(x,y) : g.lineTo(x,y);
    }
    g.stroke();
  }
  // песчинки
  const grain = ['#a8825a','#c9a46c','#e8d0a0','#8f6f48','#f2e2bb','#b69060'];
  for (let i=0;i<12000;i++){
    g.globalAlpha = 0.25 + rnd()*0.4;
    g.fillStyle = grain[(rnd()*grain.length)|0];
    const s = 0.6 + rnd()*1.3;
    g.fillRect(rnd()*S, rnd()*S, s, s);
  }
  // камешки
  g.globalAlpha = 1;
  for (let i=0;i<160;i++){
    const x=rnd()*S, y=rnd()*S, rx=1+rnd()*3, ry=rx*(0.6+rnd()*0.4);
    g.fillStyle = `rgba(${95+rnd()*50|0},${80+rnd()*40|0},${60+rnd()*30|0},0.85)`;
    g.beginPath(); g.ellipse(x,y,rx,ry,rnd()*3,0,6.283); g.fill();
    g.fillStyle = 'rgba(255,240,210,0.35)';
    g.beginPath(); g.ellipse(x-rx*0.25,y-ry*0.3,rx*0.4,ry*0.35,0,0,6.283); g.fill();
  }
  return toTex(c, 54, 54);
}

// Кора акации: вертикальные волокна + трещины
function makeBarkTexture(){
  const W=128, H=256, [c,g] = makeCanvas(W*2,H*2); g.scale(2,2);
  g.fillStyle = '#5d432a'; g.fillRect(0,0,W,H);
  const fib = ['#7a5a38','#3a281a','#6b4d30','#2c1e12','#8a6a44'];
  for (let i=0;i<260;i++){
    g.strokeStyle = fib[(rnd()*fib.length)|0];
    g.globalAlpha = 0.25 + rnd()*0.4;
    g.lineWidth = 1 + rnd()*3;
    let cx = rnd()*W; g.beginPath(); g.moveTo(cx,0);
    for (let y=32;y<=H;y+=32){ cx += (rnd()-0.5)*5; g.lineTo(cx,y); }
    g.stroke();
  }
  g.globalAlpha = 0.85; g.strokeStyle = '#1e140b';
  for (let i=0;i<22;i++){
    g.lineWidth = 1.5 + rnd()*2.5; let x = rnd()*W, y = rnd()*H; g.beginPath(); g.moveTo(x,y);
    const len = 40 + rnd()*90;
    for (let l=0;l<len;l+=10){ x += (rnd()-0.5)*5; y += 10; g.lineTo(x,y); }
    g.stroke();
  }
  return toTex(c, 2, 2);
}

// Листва кроны
function makeLeafTexture(){
  const S=256, [c,g] = makeCanvas(S*2,S*2); g.scale(2,2);
  g.fillStyle = '#6a8434'; g.fillRect(0,0,S,S);
  const cols = ['#7c9c3c','#5b7a2a','#8eaa4c','#a4b45a','#4f6a24','#9a9c4a'];
  for (let i=0;i<1100;i++){
    g.fillStyle = cols[(rnd()*cols.length)|0]; g.globalAlpha = 0.55 + rnd()*0.4;
    g.beginPath(); g.ellipse(rnd()*S, rnd()*S, 3+rnd()*7, 2+rnd()*4, rnd()*3.14, 0, 6.283); g.fill();
  }
  return toTex(c, 1, 1);
}

// Сухая трава (с прозрачностью, для спрайтов)
function makeGrassTexture(){
  const [c,g] = makeCanvas(512,512); g.scale(2,2);
  const cols = [['#8c7a2e','#d9c35c'],['#6f8a30','#b8cf5a'],['#a08838','#e8d27a'],['#7a8a2a','#c4c860']];
  for (let i=0;i<34;i++){
    const bx=10+rnd()*236, h=90+rnd()*150, tx=bx+(rnd()-0.5)*70, w=3+rnd()*4;
    const [c0,c1] = cols[(rnd()*cols.length)|0];
    const gr = g.createLinearGradient(0,256,0,256-h);
    gr.addColorStop(0,c0); gr.addColorStop(1,c1);
    g.fillStyle = gr; g.beginPath();
    g.moveTo(bx-w,256);
    g.quadraticCurveTo(bx+(tx-bx)*0.2, 256-h*0.6, tx, 256-h);
    g.quadraticCurveTo(bx+(tx-bx)*0.2+w*0.5, 256-h*0.6, bx+w, 256);
    g.closePath(); g.fill();
  }
  return toTex(c, 1, 1, false);
}

// Вода с бликами
function makeWaterTexture(){
  const S=256, [c,g] = makeCanvas(S,S);
  const gr = g.createLinearGradient(0,0,S,S);
  gr.addColorStop(0,'#3f93a6'); gr.addColorStop(0.5,'#2f7c90'); gr.addColorStop(1,'#3a8ea0');
  g.fillStyle = gr; g.fillRect(0,0,S,S);
  for (let i=0;i<34;i++){
    const y0=rnd()*S, amp=2+rnd()*4, k=1+Math.floor(rnd()*3), ph=rnd()*6.28;
    g.strokeStyle = `rgba(255,255,255,${0.06+rnd()*0.1})`; g.lineWidth = 1+rnd()*2; g.beginPath();
    for (let x=0;x<=S;x+=8){ const y=y0+amp*Math.sin(2*Math.PI*k*x/S+ph); x===0?g.moveTo(x,y):g.lineTo(x,y); }
    g.stroke();
  }
  for (let i=0;i<220;i++){
    g.strokeStyle = `rgba(255,255,240,${0.15+rnd()*0.35})`; g.lineWidth = 1;
    const x=rnd()*S, y=rnd()*S, l=3+rnd()*9;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+l,y+rnd()*2-1); g.stroke();
  }
  return toTex(c, 3, 3);
}

// Небо: синее вверху → голубое → золотистое у горизонта (цвет горизонта = цвет тумана)
function makeSkyTexture(){
  const [c,g] = makeCanvas(8,512);
  const gr = g.createLinearGradient(0,0,0,512);
  gr.addColorStop(0.00,'#1f55a8'); gr.addColorStop(0.22,'#3f88d0'); gr.addColorStop(0.38,'#8fc3e8');
  gr.addColorStop(0.46,'#e8d2a0'); gr.addColorStop(0.50,'#dcbf8a'); gr.addColorStop(1.00,'#dcbf8a');
  g.fillStyle = gr; g.fillRect(0,0,8,512);
  return toTex(c, 1, 1, false);
}
function makeSunTexture(){
  const [c,g] = makeCanvas(128,128);
  const gr = g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(255,248,210,1)'); gr.addColorStop(0.22,'rgba(255,226,150,0.85)');
  gr.addColorStop(1,'rgba(255,200,100,0)');
  g.fillStyle = gr; g.fillRect(0,0,128,128);
  return toTex(c, 1, 1, false);
}

/* ============================================================
   ИНСТАНСИНГ-ХЕЛПЕР: одна геометрия → сотни объектов за один draw call
   ============================================================ */
function setM(im,i,x,y,z,sx,sy,sz,ry=0,rx=0,rz=0,order='XYZ'){
  dummy.rotation.order = order;
  dummy.position.set(x,y,z); dummy.rotation.set(rx,ry,rz); dummy.scale.set(sx,sy,sz);
  dummy.updateMatrix(); im.setMatrixAt(i, dummy.matrix);
}
function finishStatic(im, shadow=false){
  im.instanceMatrix.needsUpdate = true;
  if (im.instanceColor) im.instanceColor.needsUpdate = true;
  im.computeBoundingSphere();
  im.castShadow = shadow;
  im.matrixAutoUpdate = false; im.updateMatrix();
  scene.add(im);
}
function randPos(minSpawn=7, lakeMargin=4, margin=4){
  for (let k=0;k<80;k++){
    const x = rr(-WORLD_LIM+margin, WORLD_LIM-margin), z = rr(-WORLD_LIM+margin, WORLD_LIM-margin);
    if (Math.hypot(x,z) < minSpawn) continue;
    if (waterSd(x,z) < lakeMargin) continue;
    return [x,z];
  }
  return [30,30];
}

/* ============================================================
   СЦЕНА: рендерер, свет, небо
   ============================================================ */
function initRenderer(){
  renderer = new THREE.WebGLRenderer({ canvas:$('gl'), antialias:!!GFX.aa, powerPreference:'high-performance' });
  pr = gfxPR();
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.8;
  renderer.autoClear = false;
  renderer.shadowMap.enabled = GFX.shadow > 0;
  renderer.shadowMap.type = GFX.shadow === 2 ? THREE.PCFSoftShadowMap : THREE.PCFShadowMap;
  renderer.shadowMap.autoUpdate = GFX.shadow !== 1;
  aniso = Math.min(GFX_LV.tex.an[GFX.tex], renderer.capabilities.getMaxAnisotropy());
  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xdcbf8a, 60, 190);
  camera = new THREE.PerspectiveCamera(60, 16/9, 0.15, 700);
  layout();
}

function buildLightsAndSky(){
  // Солнце с тенями, которое следует за игроком (маленький фрустум = чёткие тени и быстро)
  sun = new THREE.DirectionalLight(0xffe0a8, 1.5*LK);
  sun.castShadow = GFX.shadow > 0;
  const ms = gfxShadowSize();
  sun.shadow.mapSize.set(ms, ms);
  const sc = sun.shadow.camera;
  sc.left = -30; sc.right = 30; sc.top = 30; sc.bottom = -30; sc.near = 1; sc.far = 160;
  sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.04;
  scene.add(sun, sun.target);

/* ============================================================
   ЗЕМЛЯ
   ============================================================ */
function buildGround(){
  const SEG = GFX_LV.terrain.seg[GFX.terrain];
  const g = new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE, SEG, SEG);
  g.rotateX(-Math.PI/2);
  const pos = g.attributes.position;
  const col = new Float32Array(pos.count*3);
  for (let i=0;i<pos.count;i++){
    const x=pos.getX(i), z=pos.getZ(i), h=getH(x,z);
    pos.setY(i,h);
    // Мокрый, тёмный песок у берега озера (песчаный «берег-кольцо»)
    const d = Math.hypot(x-LAKE.x, z-LAKE.z);
    const wet = Math.max(1 - smooth(14, 26, d), 1 - smooth(-1, 10, riverSd(x,z)));
    const sh = 0.95 + 0.07*Math.sin(x*0.31)*Math.cos(z*0.27) + (rnd()-0.5)*0.05 + clamp(h,-1,1.5)*0.08;
    const rk = smooth(1.8,4.8,h)*(0.6+0.4*Math.sin(x*0.09+z*0.05)), lo = smooth(-0.4,-2.2,h);
    col[i*3]   = sh*(1-0.30*wet)*(1-0.06*rk)*(1-0.12*lo);
    col[i*3+1] = sh*(1-0.38*wet)*(1-0.22*rk)*(1-0.12*lo);
    col[i*3+2] = sh*(1-0.46*wet)*(1-0.36*rk)*(1-0.12*lo);
  }
  // ГСЧ тратил по одному числу на вершину — дотрачиваем разницу, чтобы мир (деревья, камни) был ровно тем же при любой детализации земли
  { const ORIG = ((isMobile ? 170 : 230) + 1) ** 2; for (let i = pos.count; i < ORIG; i++) rnd(); }
  g.setAttribute('color', new THREE.BufferAttribute(col,3));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    map:makeSandTexture(), vertexColors:true, roughness:0.95, metalness:0 }));
  m.receiveShadow = true; m.matrixAutoUpdate = false;
  scene.add(m);
}

function buildLake(){
  waterTex = makeWaterTexture();
  const geo = new THREE.CircleGeometry(LAKE.r, 40); geo.rotateX(-Math.PI/2);
  const w = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    map:waterTex, roughness:0.15, metalness:0.5, transparent:true, opacity:0.82,
    emissive:0x0b3a44, emissiveIntensity:0.5 }));
  w.position.set(LAKE.x, WATER_Y, LAKE.z);
  w.matrixAutoUpdate = false; w.updateMatrix();
  scene.add(w);
  buildRiver();
}
function buildRiver(){
  waterTex.wrapS = waterTex.wrapT = THREE.RepeatWrapping;
  const half=GROUND_SIZE/2, step=3, n=Math.round(GROUND_SIZE/step)+1, pos=new Float32Array(n*6), uv=new Float32Array(n*4), col=new Float32Array(n*6), idx=[];
  for(let i=0;i<n;i++){
    const z=-half+i*step, cx=riverX(z), hw=(riverHW(z)+1.3)*Math.sqrt(1+riverDX(z)**2), fk=fordK(z);
    pos.set([cx-hw,WATER_Y,z, cx+hw,WATER_Y,z],i*6);
    uv.set([0,z/18, hw/9,z/18],i*4);
    const r=.78+.55*fk, g=.92+.3*fk, b=1.0-.05*fk;            // на броде вода светлее — мелко
    col.set([r,g,b,r,g,b],i*6);
    if(i<n-1){ const a=i*2; idx.push(a,a+2,a+1, a+1,a+2,a+3); }
  }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setAttribute('uv',new THREE.BufferAttribute(uv,2)); g.setAttribute('color',new THREE.BufferAttribute(col,3)); g.setIndex(idx); g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({map:waterTex,vertexColors:true,roughness:0.15,metalness:0.5,transparent:true,opacity:0.82,emissive:0x0b3a44,emissiveIntensity:0.5,side:THREE.DoubleSide}));
  m.matrixAutoUpdate=false; scene.add(m);
}

/* ============================================================
   ТРАВА: 2000 спрайтов в одном InstancedMesh, ветер считается в вершинном шейдере
   ============================================================ */
function buildGrass(){
  const p1 = new THREE.PlaneGeometry(1,1); p1.translate(0,0.5,0);
  const p2 = p1.clone(); p2.rotateY(Math.PI/2);
  const geo = mergeGeometries([p1,p2]);          // две пересекающиеся плоскости = объём
  const COUNT = 5000;
  const phases = new Float32Array(COUNT);
  grassMat = new THREE.ShaderMaterial({
    uniforms: THREE.UniformsUtils.merge([ THREE.UniformsLib.fog, {
      map:{ value:makeGrassTexture() }, uTime:{ value:0 }, uTint:{ value:new THREE.Color(1.1,1.05,0.85) } } ]),
    vertexShader: `
      uniform float uTime;
      attribute float aPhase;
      varying vec2 vUv;
      #include <fog_pars_vertex>
      void main(){
        vUv = uv;
        vec3 p = position;
        // качание травинки: rotation.z = sin(time + phase) * 0.15
        float a = sin(uTime*1.8 + aPhase) * 0.15;
        float c = cos(a), s = sin(a);
        p.xy = vec2(p.x*c - p.y*s, p.x*s + p.y*c);
        vec4 mvPosition = modelViewMatrix * instanceMatrix * vec4(p,1.0);
        gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: `
      uniform sampler2D map;
      uniform vec3 uTint;
      varying vec2 vUv;
      #include <fog_pars_fragment>
      void main(){
        vec4 t = texture2D(map, vUv);
        if (t.a < 0.5) discard;
        float ao = mix(0.65, 1.0, smoothstep(0.0, 0.5, vUv.y));
        gl_FragColor = vec4(t.rgb * uTint * ao, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
        #include <fog_fragment>
      }`,
    fog:true, side:THREE.DoubleSide
  });
  const im = new THREE.InstancedMesh(geo, grassMat, COUNT);
  let n = 0;
  while (n < COUNT){
    // кусты травы кластерами: ~400 центров × 5 травинок
    const cx = rr(-WORLD_LIM+3, WORLD_LIM-3), cz = rr(-WORLD_LIM+3, WORLD_LIM-3);
    if (waterSd(cx,cz) < 2) continue;
    for (let k=0;k<5 && n<COUNT;k++){
      const x = cx + rr(-1.6,1.6), z = cz + rr(-1.6,1.6);
      const wdt = rr(0.9,1.4), hgt = rr(0.8,1.6);
      setM(im, n, x, getH(x,z)-0.02, z, wdt, hgt, wdt, rnd()*6.28);
      phases[n] = x*0.12 + z*0.09 + rnd()*0.8;       // волна ветра идёт по полю
      n++;
    }
  }
  geo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(phases,1));
  finishStatic(im, false);
  im.frustumCulled = false;
  grassMesh = im; gfxApplyGrass();
}

/* ============================================================
   АКАЦИИ (35): ствол + 5 веток + зонтичная крона из 3 слоёв — всё инстансингом
   ============================================================ */
function buildTrees(){
  const N = 96;
  const trunkGeo  = new THREE.CylinderGeometry(0.26,0.46,4.2,8,1); trunkGeo.translate(0,2.1,0);
  const branchGeo = new THREE.CylinderGeometry(0.07,0.14,1,5,1);   branchGeo.translate(0,0.5,0);
  const crownGeo  = new THREE.CylinderGeometry(1,0.88,1,18,1);
  const barkMat = new THREE.MeshStandardMaterial({ map:makeBarkTexture(), roughness:0.95 });
  const leafMat = new THREE.MeshStandardMaterial({ map:makeLeafTexture(), roughness:0.9 });
  const trunks   = new THREE.InstancedMesh(trunkGeo,  barkMat, N);
  const branches = new THREE.InstancedMesh(branchGeo, barkMat, N*5);
  const crowns   = new THREE.InstancedMesh(crownGeo,  leafMat, N*3);
  const radii = [5.2,4.0,2.7], thick = [0.6,0.55,0.5];
  const placed = [];
  for (let i=0;i<N;i++){
    let x,z, ok=false;
    for (let k=0;k<60 && !ok;k++){
      [x,z] = randPos(9, 8, 8);
      ok = placed.every(p => Math.hypot(p[0]-x,p[1]-z) > 9);
    }
    placed.push([x,z]);
    const s = rr(0.8,1.4), h = getH(x,z), yaw = rnd()*6.28, H = 4.2*s;
    setM(trunks, i, x, h-0.1, z, s, s, s, yaw);
    for (let b=0;b<5;b++){
      const ang = yaw + b*(Math.PI*2/5) + rr(-0.3,0.3);
      const tilt = rr(0.75,1.0), len = 2.6*s*rr(0.9,1.15);
      const by = H*(0.58 + 0.08*(b%3));
      setM(branches, i*5+b, x, h+by, z, s*0.9, len, s*0.9, ang, tilt, 0, 'YXZ');
    }
    for (let l=0;l<3;l++){
      const R = radii[l]*s*rr(0.9,1.1);
      setM(crowns, i*3+l, x+rr(-0.5,0.5)*s, h+H+0.15+l*0.38, z+rr(-0.5,0.5)*s,
           R, thick[l], R, rnd()*6.28, rr(-0.05,0.05), rr(-0.05,0.05));
      crowns.setColorAt(i*3+l, new THREE.Color().setScalar(rr(0.82,1.1)));
    }
    const ob = { x, z, r: 0.5*s }; obstacles.push(ob);
    const parts=[[trunks,i]]; for(let b=0;b<5;b++) parts.push([branches,i*5+b]); for(let l=0;l<3;l++) parts.push([crowns,i*3+l]);
    trees.push({ x, z, s, i, hp:5, hpMax:5, logs:5, r:ob.r, ob, gone:false, kind:'acacia', parts, yaw });
  }
  finishStatic(trunks,true); finishStatic(branches,true); finishStatic(crowns,true);
  treeMeshes = { trunks, branches, crowns };
}

/* ============================================================
   КУСТЫ (45) + красные ягоды
   ============================================================ */
function buildBushes(){
  const N = 110, MAXB = N*4;
  const geo = new THREE.IcosahedronGeometry(1,1);
  const mat = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.9, flatShading:true });
  const bushes = new THREE.InstancedMesh(geo, mat, MAXB);
  const blobs = []; let n = 0;
  const tmp = new THREE.Color();
  for (let i=0;i<N;i++){
    const [x,z] = randPos(5, 3, 3);
    const cnt = 3 + ((rnd()*2)|0);
    const berryBush = i < 60;
    const bb = [];
    for (let k=0;k<cnt;k++){
      const s = rr(0.5,0.9);
      const bx = x+rr(-0.7,0.7), bz = z+rr(-0.7,0.7), by = getH(bx,bz)+s*0.6;
      setM(bushes, n, bx, by, bz, s, s*0.85, s, rnd()*6.28);
      tmp.set(0x6a8030).offsetHSL(rr(-0.02,0.02), 0, rr(-0.05,0.05));
      bushes.setColorAt(n, tmp);
      if (berryBush) bb.push([bx,by,bz,s]);
      n++;
    }
    if (berryBush) blobs.push(bb);
  }
  bushes.count = n;
  finishStatic(bushes, false);

  // ягоды — отдельный инстанс
  const berryGeo = new THREE.SphereGeometry(0.06,6,5);
  const PER = 9;
  const berries = new THREE.InstancedMesh(berryGeo, new THREE.MeshStandardMaterial({ color:0xb01838, roughness:0.45 }), blobs.length*PER);
  berryMesh = berries; berryBushes = [];
  let b = 0;
  for (const bb of blobs){
    let cx=0, cz=0; for (const q of bb){ cx+=q[0]; cz+=q[2]; } cx/=bb.length; cz/=bb.length;
    const idx=[], mats=[];
    for (let k=0;k<PER;k++){
      const [bx,by,bz,s] = bb[(rnd()*bb.length)|0];
      let dx=rr(-1,1), dy=rr(0.1,1), dz=rr(-1,1); const l=Math.hypot(dx,dy,dz)||1;
      setM(berries, b, bx+dx/l*s*0.98, by+dy/l*s*0.85, bz+dz/l*s*0.98, 1.25,1.25,1.25);
      const M=new THREE.Matrix4(); berries.getMatrixAt(b,M); mats.push(M); idx.push(b); b++;
    }
    berryBushes.push({x:cx,z:cz,idx,mats,hands:3,regrow:0});
  }
  finishStatic(berries, false);
  berries.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
}

/* ============================================================
   КАМНИ (~56): деформированные додекаэдры
   ============================================================ */
function buildRocks(){
  const g = new THREE.DodecahedronGeometry(1,1);
  const p = g.attributes.position;
  for (let i=0;i<p.count;i++){
    const x=p.getX(i), y=p.getY(i), z=p.getZ(i);
    const n = 1 + 0.22*Math.sin(x*4.1+y*2.3)*Math.cos(z*3.7+x*1.9) + 0.1*Math.sin(y*7+z*5);
    p.setXYZ(i, x*n, y*n, z*n);
  }
  g.computeVertexNormals();
  const N = 120;
  const im = new THREE.InstancedMesh(g, new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.95, flatShading:true }), N);
  for (let i=0;i<N;i++){
    let x,z;
    if (i < 18){            // вокруг озера
      const a = rnd()*6.283, r = LAKE.r + rr(-0.6,6);
      x = LAKE.x + Math.cos(a)*r; z = LAKE.z + Math.sin(a)*r;
    } else { [x,z] = randPos(6, 2, 3); }
    const sx = rr(0.5,1.6), sy = sx*rr(0.5,0.9), sz = sx*rr(0.7,1.2);
    setM(im, i, x, getH(x,z)+sy*0.35, z, sx, sy, sz, rnd()*6.28, rr(-0.2,0.2), rr(-0.2,0.2));
    obstacles.push({ x, z, r: Math.max(sx,sz)*0.85 });   // физика: камни непроходимы
    im.setColorAt(i, new THREE.Color().setHSL(0.08, 0.1, 0.25 + rnd()*0.15));
  }
  finishStatic(im, true);
}

/* ============================================================
   КОСТИ И ЧЕРЕПА
   ============================================================ */
function buildBones(){
  // Череп: сфера + морда + 2 рога (склеено в одну геометрию)
  const sk = new THREE.SphereGeometry(0.12,10,8); sk.scale(1,0.9,1.1);
  const snout = new THREE.CylinderGeometry(0.05,0.07,0.2,8); snout.rotateX(Math.PI/2); snout.translate(0,-0.03,0.2);
  const horn = side => { const h = new THREE.ConeGeometry(0.03,0.24,6); h.translate(0,0.12,0);
    h.rotateZ(-side*0.9); h.translate(side*0.07,0.07,-0.02); return h; };
  const skullGeo = mergeGeometries([sk, snout, horn(1), horn(-1)]);
  const eyeL = new THREE.SphereGeometry(0.03,6,5); eyeL.translate(0.05,0.03,0.1);
  const eyeR = new THREE.SphereGeometry(0.03,6,5); eyeR.translate(-0.05,0.03,0.1);
  const socketGeo = mergeGeometries([eyeL, eyeR]);
  const boneMat = new THREE.MeshStandardMaterial({ color:0xeadfc0, roughness:0.85 });
  const N = 22;
  const skulls  = new THREE.InstancedMesh(skullGeo, boneMat, N);
  const sockets = new THREE.InstancedMesh(socketGeo, new THREE.MeshStandardMaterial({ color:0x2a2218, roughness:1 }), N);
  for (let i=0;i<N;i++){
    const [x,z] = randPos(5, 3, 3);
    const y = getH(x,z)+0.07, yaw = rnd()*6.28, rx = rr(-0.3,0.3), rz = rr(-0.3,0.3), s = rr(0.9,1.3);
    setM(skulls,  i, x, y, z, s,s,s, yaw, rx, rz);
    setM(sockets, i, x, y, z, s,s,s, yaw, rx, rz);
  }
  finishStatic(skulls, false); finishStatic(sockets, false);

  // Длинные кости
  const shaft = new THREE.CylinderGeometry(0.018,0.018,0.5,6);
  const e1 = new THREE.SphereGeometry(0.035,6,5); e1.translate(0,0.25,0);
  const e2 = new THREE.SphereGeometry(0.035,6,5); e2.translate(0,-0.25,0);
  const boneGeo = mergeGeometries([shaft,e1,e2]);
  const M = 14;
  const bones = new THREE.InstancedMesh(boneGeo, boneMat, M);
  for (let i=0;i<M;i++){
    const [x,z] = randPos(5, 3, 3);
    setM(bones, i, x, getH(x,z)+0.03, z, 1,rr(0.7,1.3),1, rnd()*6.28, 0, Math.PI/2 + rr(-0.15,0.15));
  }
  finishStatic(bones, false);
}

/* ============================================================
   ГЛАВНЫЙ ГЕРОЙ — АБОРИГЕН
   ============================================================ */
function buildPlayer(skinC=0x6b3a1a, peer=false){
  const skin  = new THREE.MeshStandardMaterial({ color:skinC, roughness:0.75 });
  const white = new THREE.MeshStandardMaterial({ color:0xf4f0e6, roughness:0.4 });
  const dark  = new THREE.MeshStandardMaterial({ color:0x120a06, roughness:0.8 });
  const hairM = new THREE.MeshStandardMaterial({ color:(skinC>0xa00000?0x4a2c14:0x1a0f08), roughness:1 });
  const cloth = new THREE.MeshStandardMaterial({ color:0x8b6a3a, roughness:0.95, side:THREE.DoubleSide });
  const clothD= new THREE.MeshStandardMaterial({ color:0x3a2812, roughness:0.95 });
  const boneM = new THREE.MeshStandardMaterial({ color:0xf0e5c0, roughness:0.7 });
  const wood  = new THREE.MeshStandardMaterial({ color:0x6a4a2a, roughness:0.9 });
  const stone = new THREE.MeshStandardMaterial({ color:0x555555, roughness:0.95, flatShading:true });
  const leather = new THREE.MeshStandardMaterial({ color:0x4a3018, roughness:0.95 });

  const mesh = (geo,mat,parent,x=0,y=0,z=0,cast=false) => {
    const m = new THREE.Mesh(geo,mat); m.position.set(x,y,z); m.castShadow = cast; parent.add(m); return m; };
  const sph = (r,w=12,h=8) => new THREE.SphereGeometry(r,w,h);

  const root = new THREE.Group();
  const body = new THREE.Group(); body.position.y = HIP; root.add(body);   // таз

  /* --- НОГИ: бедро → голень → ступня, колено — вложенная группа --- */
  const thighGeo = new THREE.CylinderGeometry(0.085,0.062,0.48,8);
  const shinGeo  = new THREE.CylinderGeometry(0.055,0.04,0.43,8);
  const footGeo  = new THREE.BoxGeometry(0.1,0.08,0.26);
  const kneeSph = sph(0.058,8,6), hipSph = sph(0.085,8,6);
  const makeLeg = side => {
    const hip = new THREE.Group(); hip.position.set(side*0.11,0,0); body.add(hip);
    mesh(hipSph, skin, hip);
    mesh(thighGeo, skin, hip, 0,-0.24,0, true);
    const knee = new THREE.Group(); knee.position.y = -0.48; hip.add(knee);
    mesh(kneeSph, skin, knee);
    mesh(shinGeo, skin, knee, 0,-0.215,0, true);
    mesh(footGeo, skin, knee, 0,-0.47,0.06, true);
    return { hip, knee };
  };
  const legL = makeLeg(1), legR = makeLeg(-1);   // +x — левая сторона персонажа (он смотрит в +z)

  /* --- НАБЕДРЕННАЯ ПОВЯЗКА --- */
  mesh(new THREE.CylinderGeometry(0.2,0.245,0.3,16,1,true), cloth, body, 0,-0.05,0, true);
  const stripeGeo = new THREE.BoxGeometry(0.04,0.22,0.012);
  for (const a of [-0.4,0,0.4]){
    const s = mesh(stripeGeo, clothD, body, Math.sin(a)*0.232, -0.06, Math.cos(a)*0.232);
    s.rotation.y = a;
  }

  /* --- ТОРС --- */
  const torso = new THREE.Group(); body.add(torso);
  const cap = mesh(new THREE.CapsuleGeometry(0.155,0.30,4,12), skin, torso, 0,0.3,0, true); cap.scale.set(1,1,0.75);
  const chest = mesh(sph(0.2,14,10), skin, torso, 0,0.46,0, true); chest.scale.set(1.1,0.85,0.72);
  mesh(new THREE.CylinderGeometry(0.05,0.06,0.1,8), skin, torso, 0,0.66,0);

  /* --- ОЖЕРЕЛЬЕ из 12 клыков/зубов --- */
  const teeth = new THREE.InstancedMesh(new THREE.ConeGeometry(0.014,0.07,6), boneM, 12);
  for (let i=0;i<12;i++){
    const a = i/12*Math.PI*2;
    setM(teeth, i, Math.sin(a)*0.15, 0.58, Math.cos(a)*0.12 + 0.01, 1,1,1, a, Math.PI-0.3, 0, 'YXZ');
  }
  teeth.instanceMatrix.needsUpdate = true; teeth.frustumCulled = false; torso.add(teeth);

  /* --- ГОЛОВА --- */
  const head = new THREE.Group(); head.position.set(0,0.78,0); torso.add(head);
  const skull = mesh(sph(0.115,16,12), skin, head, 0,0,0, true); skull.scale.set(1,1.18,1.05);
  const jaw = mesh(sph(0.085,12,8), skin, head, 0,-0.075,0.025); jaw.scale.set(1,0.75,1);
  for (const sd of [1,-1]){
    const ear = mesh(sph(0.026,8,6), skin, head, sd*0.116,0,0); ear.scale.set(0.5,1,1);
    mesh(sph(0.02,8,6), white, head, sd*0.04,0.02,0.105);                 // белок глаза
    mesh(sph(0.012,6,5), dark,  head, sd*0.04,0.02,0.118);                 // зрачок
    const brow = mesh(new THREE.BoxGeometry(0.05,0.011,0.012), dark, head, sd*0.042,0.062,0.108);
    brow.rotation.z = -sd*0.12;
  }
  const nose = mesh(sph(0.02,8,6), skin, head, 0,-0.015,0.118); nose.scale.set(1,1.2,1.2);
  mesh(new THREE.BoxGeometry(0.05,0.008,0.01), dark, head, 0,-0.06,0.112);   // рот
  // афро: полусфера + 14 торчащих пучков
  const afroC = new THREE.Vector3(0,0.04,-0.04);
  mesh(new THREE.SphereGeometry(0.14,16,10,0,Math.PI*2,0,Math.PI*0.62), hairM, head, afroC.x,afroC.y,afroC.z, true);
  const tufts = new THREE.InstancedMesh(new THREE.ConeGeometry(0.03,0.08,6), hairM, 14);
  const UP = new THREE.Vector3(0,1,0), dir = new THREE.Vector3();
  let tn = 0;
  while (tn < 14){
    const y = 0.25 + 0.75*rnd(), a = rnd()*6.283, r = Math.sqrt(1-y*y);
    dir.set(r*Math.cos(a), y, r*Math.sin(a));
    if (dir.z > 0.5 && dir.y < 0.6) continue;                          // не лезем на лицо
    dummy.rotation.order = 'XYZ';
    dummy.position.copy(afroC).addScaledVector(dir, 0.14);
    dummy.quaternion.setFromUnitVectors(UP, dir);
    dummy.scale.set(1,1,1); dummy.updateMatrix();
    tufts.setMatrixAt(tn++, dummy.matrix);
  }
  tufts.instanceMatrix.needsUpdate = true; tufts.frustumCulled = false; head.add(tufts);

  /* --- РУКИ: плечо → предплечье → кисть, локоть — вложенная группа --- */
  const upGeo = new THREE.CylinderGeometry(0.052,0.042,0.30,8);
  const foGeo = new THREE.CylinderGeometry(0.042,0.034,0.28,8);
  const shSph = sph(0.068,8,6), elSph = sph(0.045,8,6), handG = sph(0.05,8,6);
  const makeArm = side => {
    const sh = new THREE.Group(); sh.position.set(side*0.235,0.55,0); torso.add(sh);
    mesh(shSph, skin, sh,0,0,0,true);
    mesh(upGeo, skin, sh, 0,-0.15,0, true);
    const elbow = new THREE.Group(); elbow.position.y = -0.30; sh.add(elbow);
    mesh(elSph, skin, elbow);
    mesh(foGeo, skin, elbow, 0,-0.14,0, true);
    const hand = mesh(handG, skin, elbow, 0,-0.30,0); hand.scale.set(1,1.2,0.8);
    return { sh, elbow };
  };
  const armL = makeArm(1), armR = makeArm(-1);
  armL.sh.rotation.z = 0.1; armR.sh.rotation.z = -0.1;

  /* --- КОПЬЁ в правой руке (в группе предплечья) --- */
  const spear = new THREE.Group(); spear.position.set(0,-0.30,0); armR.elbow.add(spear);
  mesh(new THREE.CylinderGeometry(0.02,0.023,2.0,6), wood, spear, 0,0.5,0, true);       // древко
  mesh(new THREE.ConeGeometry(0.045,0.26,5), stone, spear, 0,1.63,0, true);            // каменный наконечник
  mesh(new THREE.CylinderGeometry(0.03,0.03,0.14,8), leather, spear, 0,1.46,0);        // обмотка из кожи

  // Палка в руке (показывается при прицеливании палкой)
  const held = new THREE.Group(); held.position.set(0,-0.30,0); held.visible = false; armR.elbow.add(held);
  mesh(new THREE.CylinderGeometry(0.03,0.036,1.1,6), wood, held, 0,0.35,0, true);
  const hTip = mesh(new THREE.ConeGeometry(0.036,0.2,6), new THREE.MeshStandardMaterial({color:0xd9b27a,roughness:.9}), held, 0,0.99,0); hTip.visible = false;

  // Поза покоя
  armR.elbow.rotation.x = -0.55;
  armL.elbow.rotation.x = -0.2;

  root.traverse(o => { if (o.isMesh) o.frustumCulled = true; });
  root.userData.skinM=skin; root.userData.hairM=hairM;
  if(peer){ spear.visible=false; return {root,legL,legR,armL,armR}; }
  scene.add(root);
  player = root;
  const axe = new THREE.Group(); axe.position.set(0,-0.30,0); axe.visible = false; armR.elbow.add(axe);
  mesh(new THREE.CylinderGeometry(0.028,0.034,0.9,6), wood, axe, 0,-0.40,0, true);
  mesh(new THREE.BoxGeometry(0.07,0.2,0.26), stone, axe, 0,-0.84,0.08, true);
  mesh(new THREE.BoxGeometry(0.03,0.26,0.05), new THREE.MeshStandardMaterial({color:0xbfbfbf,roughness:.55}), axe, 0,-0.84,0.22);
  P = { body, torso, head, legL, legR, armL, armR, spear, held, axe };
}

/* ============================================================
   АНИМАЦИЯ ПЕРСОНАЖА
   ============================================================ */
function animatePlayer(dt, t, speedNorm){
  const sn = Math.min(1, speedNorm);
  moveAmt += (sn - moveAmt) * Math.min(1, dt*10);            // плавное затухание в покое
  const m = moveAmt;
  walkPhase += dt * 10 * sn * (1 + 0.5*sprintK);
  const s = Math.sin(walkPhase), c = Math.cos(walkPhase);
  const swing = 0.55*m*(1 + 0.3*sprintK);

  // Ноги: бедро качается, колено сгибается в фазе переноса
  P.legL.hip.rotation.x = -s*swing;
  P.legR.hip.rotation.x =  s*swing;
  P.legL.knee.rotation.x = (0.08 + 0.9*Math.max(0, c))*m + 0.02;
  P.legR.knee.rotation.x = (0.08 + 0.9*Math.max(0,-c))*m + 0.02;

  // Руки: плечо качается, локоть сгибается
  P.armL.sh.rotation.x = s*0.5*m;
  P.armL.elbow.rotation.x = -(0.2 + 0.5*Math.max(0,-c)*m);
  P.armR.sh.rotation.x = -s*0.22*m;
  P.armR.elbow.rotation.x = -(0.55 + 0.1*Math.max(0,c)*m);
  // копьё остаётся почти вертикальным (с небольшим наклоном вперёд)
  P.spear.rotation.set(0.1 + 0.03*Math.sin(t*1.5) - P.armR.sh.rotation.x - P.armR.elbow.rotation.x, 0, 0);

  // Торс: покачивание при ходьбе + «дыхание» в покое
  P.torso.rotation.y = s*0.14*m;
  P.torso.rotation.z = Math.cos(walkPhase)*0.03*m;
  P.head.rotation.y = -P.torso.rotation.y*0.6;
  P.torso.position.y = Math.sin(t*2.2)*0.006*(1-m);
  P.body.position.y = HIP - 0.05*m*Math.abs(s);
  applyActionPoses(dt);
}

/* ---------- Позы действий: прицеливание/бросок и подбор предметов ---------- */
const _qa = new THREE.Quaternion(), _qb = new THREE.Quaternion(), _qs = new THREE.Quaternion();
const _AXx = new THREE.Vector3(1,0,0), _AXy = new THREE.Vector3(0,1,0), _AXz = new THREE.Vector3(0,0,1);
const easeIO = x => { x = clamp(x,0,1); return x*x*(3-2*x); };
const mixV = (a,b,k) => a + (b-a)*k;
function applyActionPoses(dt){
  const wantAim = aiming || throwT > 0;
  aimBlend += ((wantAim?1:0) - aimBlend) * Math.min(1, dt*(wantAim?9:6));
  if (!wantAim && aimBlend < 0.002) aimBlend = 0;
  const pk = crouchK;                       // приседание при подборе или питье

  // сброс того, что базовая анимация ходьбы не задаёт сама
  P.torso.rotation.x = 0;
  P.armL.sh.rotation.z = 0.1; P.armR.sh.rotation.z = -0.1;
  P.head.rotation.x = 0;

  // ---- ПОДБОР: приседание, наклон, рука тянется к земле ----
  if (pk > 0){
    P.body.position.y = mixV(P.body.position.y, HIP - 0.44, pk);
    P.torso.rotation.x = mixV(P.torso.rotation.x, 1.0, pk);
    P.torso.rotation.y = mixV(P.torso.rotation.y, 0, pk);
    P.torso.rotation.z = mixV(P.torso.rotation.z, 0, pk);
    P.head.rotation.y  = mixV(P.head.rotation.y, 0, pk);
    P.head.rotation.x  = -0.7*pk;
    for (const lg of [P.legL, P.legR]){
      lg.hip.rotation.x  = mixV(lg.hip.rotation.x, -1.3, pk);
      lg.knee.rotation.x = mixV(lg.knee.rotation.x, 1.9, pk);
    }
    P.armR.sh.rotation.x    = mixV(P.armR.sh.rotation.x, -1.35, pk);
    P.armR.elbow.rotation.x = mixV(P.armR.elbow.rotation.x, -0.25, pk);
    P.armL.sh.rotation.x    = mixV(P.armL.sh.rotation.x, -0.8, pk);
    P.armL.elbow.rotation.x = mixV(P.armL.elbow.rotation.x, -0.4, pk);
    P.spear.rotation.x -= P.torso.rotation.x;     // копьё не заваливается вместе с наклоном
  }

  // ---- ПРИЦЕЛИВАНИЕ / БРОСОК ----
  if (aimBlend > 0){
    const b = aimBlend;
    const c = aiming ? clamp(aimT/AIM_MAX, 0, 1) : relCharge;     // «натяжение» растёт с удержанием
    let twist = -0.25 - 0.2*c, armX = -2.2 - 0.6*c, elb = -1.2, legF = -0.5, legB = 0.4, lean = -0.1*c;
    if (!aiming && throwT > 0){                                   // замах вперёд после отпускания
      const k = easeIO(1 - throwT/0.35);
      twist = mixV(twist, 0.35, k); armX = mixV(armX, -0.5, k); elb = mixV(elb, -0.15, k);
      legF = mixV(legF, -0.65, k); legB = mixV(legB, 0.5, k); lean = mixV(lean, 0.2, k);
    }
    P.torso.rotation.y = mixV(P.torso.rotation.y, twist, b);
    P.head.rotation.y  = mixV(P.head.rotation.y, -twist, b);
    P.torso.rotation.x = mixV(P.torso.rotation.x, lean, b);
    P.torso.rotation.z = mixV(P.torso.rotation.z, 0, b);
    P.legL.hip.rotation.x  = mixV(P.legL.hip.rotation.x, legF, b);
    P.legL.knee.rotation.x = mixV(P.legL.knee.rotation.x, 0.25, b);
    P.legR.hip.rotation.x  = mixV(P.legR.hip.rotation.x, legB, b);
    P.legR.knee.rotation.x = mixV(P.legR.knee.rotation.x, 0.1, b);
    P.body.position.y = mixV(P.body.position.y, HIP - 0.09, b);
    P.armR.sh.rotation.x    = mixV(P.armR.sh.rotation.x, armX, b);
    P.armR.sh.rotation.z    = mixV(P.armR.sh.rotation.z, -0.15, b);
    P.armR.elbow.rotation.x = mixV(P.armR.elbow.rotation.x, elb, b);
    P.armL.sh.rotation.x    = mixV(P.armL.sh.rotation.x, -1.45, b);
    P.armL.sh.rotation.z    = mixV(P.armL.sh.rotation.z, 0.15, b);
    P.armL.elbow.rotation.x = mixV(P.armL.elbow.rotation.x, -0.1, b);

    // Оружие в руке смотрит строго по линии прицела: отменяем повороты родителей
    const dir = aimDir(_tmpAimDir);
    const p = Math.PI/2 - Math.asin(clamp(dir.y,-1,1)) - P.torso.rotation.x;
    _qs.setFromAxisAngle(_AXx, -P.armR.elbow.rotation.x);
    _qs.multiply(_qa.setFromAxisAngle(_AXz, -P.armR.sh.rotation.z));
    _qs.multiply(_qa.setFromAxisAngle(_AXx, -P.armR.sh.rotation.x));
    _qs.multiply(_qa.setFromAxisAngle(_AXy, -P.torso.rotation.y));
    _qs.multiply(_qa.setFromAxisAngle(_AXx, p));
    P.spear.quaternion.slerp(_qs, b);
    P.held.quaternion.copy(_qs);
  }

  // ---- УДАР ТОПОРОМ: замах над головой → рубящий удар вниз ----
  if (chop){
    const u = chop.t/SWING_D, wind = easeIO(u/.3), strike = easeIO((u-.3)/.22), rec = easeIO((u-.62)/.38), w = 1-rec;
    const ax = u<.3 ? mixV(P.armR.sh.rotation.x,-2.7,wind) : mixV(-2.7,-0.45,strike);
    const el = u<.3 ? mixV(P.armR.elbow.rotation.x,-.5,wind) : mixV(-.5,-.15,strike);
    const lean = u<.3 ? -0.12*wind : mixV(-0.12,.55,strike);
    const tw = u<.3 ? .3*wind : mixV(.3,-.35,strike);
    P.armR.sh.rotation.x    = mixV(P.armR.sh.rotation.x, ax, w);
    P.armR.elbow.rotation.x = mixV(P.armR.elbow.rotation.x, el, w);
    P.armL.sh.rotation.x    = mixV(P.armL.sh.rotation.x, u<.3 ? -1.7 : -0.9, w);
    P.armL.elbow.rotation.x = mixV(P.armL.elbow.rotation.x, -.3, w);
    P.torso.rotation.x = mixV(P.torso.rotation.x, lean, w);
    P.torso.rotation.y = mixV(P.torso.rotation.y, tw, w);
    P.head.rotation.y  = mixV(P.head.rotation.y, -tw*.5, w);
    P.legL.hip.rotation.x = mixV(P.legL.hip.rotation.x, -.35, w); P.legR.hip.rotation.x = mixV(P.legR.hip.rotation.x, .25, w);
    P.legL.knee.rotation.x = mixV(P.legL.knee.rotation.x, .2, w); P.legR.knee.rotation.x = mixV(P.legR.knee.rotation.x, .15, w);
    P.body.position.y = mixV(P.body.position.y, HIP-.07*strike, w);
  }
  P.axe.visible = !!chop;
}

/* ============================================================
   ЭКРАН: ориентация, размеры, адаптивное разрешение
   ============================================================ */
const app = $('app');
function layout(){
  const W = window.innerWidth, H = window.innerHeight;
  rotated = isTouch && H > W;             // телефон «стоймя» → поворачиваем игру на 90°
  if (rotated){
    gw = H; gh = W;
    app.style.width = gw+'px'; app.style.height = gh+'px';
    app.style.left = W+'px'; app.style.top = '0px';
    app.style.transform = 'rotate(90deg)';
  } else {
    gw = W; gh = H;
    app.style.width = W+'px'; app.style.height = H+'px';
    app.style.left = '0px'; app.style.top = '0px';
    app.style.transform = 'none';
  }
  applySize();
}
function applySize(){
  if (!renderer) return;
  renderer.setPixelRatio(pr);
  renderer.setSize(gw, gh, false);
  camera.aspect = gw/gh; camera.updateProjectionMatrix();
}
// Перевод экранных координат касания в локальные координаты (с учётом поворота)
function toLocal(cx, cy){
  return rotated ? { x: cy, y: window.innerWidth - cx } : { x: cx, y: cy };
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => { setTimeout(layout,150); setTimeout(layout,600); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);
document.addEventListener('fullscreenchange', () => setTimeout(layout,100));
document.addEventListener('webkitfullscreenchange', () => setTimeout(layout,100));

// Авто-оптимизация: если FPS проседает — снижаем разрешение, затем отключаем тени, затем прореживаем траву
let fpsAcc = 0, fpsN = 0, adaptCool = 4;
function adapt(dt){
  if (!GFX.auto) return;
  adaptCool -= dt; fpsAcc += dt; fpsN++;
  if (fpsN >= 45){
    const avg = fpsAcc/fpsN; fpsAcc = 0; fpsN = 0;
    const cap = GFX_LV.fpsCap.v[GFX.fpsCap];
    const lim = cap ? Math.max(1/30, 1.3/cap) : 1/30;
    if (adaptCool <= 0 && avg > lim){
      if (pr > 0.7){ pr = Math.max(0.7, pr*0.88); applySize(); adaptCool = 2.5; }
      else if (sun.castShadow){ sun.castShadow = false; adaptCool = 2.5; }
      else if (grassMesh && grassMesh.count > 1500){ grassMesh.count = 1500; adaptCool = 2.5; }
    }
  }
}

// ---- применение настроек графики «на лету» ----
function gfxMaterials(cb){
  const seen = new Set();
  const f = o => { if (!o.material) return; (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { if (!seen.has(m)){ seen.add(m); cb(m); } }); };
  scene.traverse(f); if (fpScene) fpScene.traverse(f);
}
let _shKey = '';
function gfxApplyShadows(){
  if (!renderer || !sun) return;
  const on = GFX.shadow > 0, key = on + '/' + GFX.shadow;
  renderer.shadowMap.enabled = on;
  renderer.shadowMap.type = GFX.shadow === 2 ? THREE.PCFSoftShadowMap : THREE.PCFShadowMap;
  renderer.shadowMap.autoUpdate = GFX.shadow !== 1;      // «Простые»: тени обновляются через кадр
  sun.castShadow = on;
  const ms = gfxShadowSize();
  if (sun.shadow.mapSize.x !== ms){ sun.shadow.mapSize.set(ms, ms); if (sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map = null; } }
  if (_shKey && _shKey !== key) gfxMaterials(m => { m.needsUpdate = true; });   // шейдеры пересоберутся (один раз)
  _shKey = key;
}
function gfxApplyGrass(){
  if (!grassMesh) return;
  const n = GFX_LV.grass.n[GFX.grass];
  grassMesh.count = n; grassMesh.visible = n > 0;
}
function gfxApplyTex(){
  if (!renderer) return;
  const a = Math.min(GFX_LV.tex.an[GFX.tex], renderer.capabilities.getMaxAnisotropy());
  aniso = a;
  const seen = new Set();
  gfxMaterials(m => { const t = m.map; if (t && !seen.has(t)){ seen.add(t); if (t.anisotropy !== a){ t.anisotropy = a; t.needsUpdate = true; } } });
}
function gfxApply(){
  if (!renderer || !scene) return;
  pr = gfxPR(); applySize();
  gfxApplyShadows(); gfxApplyGrass(); gfxApplyTex();
  const fb = $('fpsBox'); if (fb) fb.style.display = GFX.fps ? 'block' : 'none';
  fpsAcc = 0; fpsN = 0; adaptCool = 3;
}

// ---- окно настроек ----
const GFX_ROWS = [['shadow','Тени'],['res','Разрешение'],['grass','Трава'],['tex','Текстуры'],['rain','Дождь'],
                  ['terrain','Детализация земли'],['fpsCap','Лимит FPS'],['fps','Счётчик FPS'],['aa','Сглаживание краёв'],['auto','Авто-оптимизация']];
let gfxFromGame = false;
function gfxCurrentPreset(){
  for (const id in GFX_PRESETS){ const P = GFX_PRESETS[id]; if (GFX_MATCH.every(k => P[k] === GFX[k])) return id; }
  return null;
}
function gfxRefreshUI(){
  const cur = gfxCurrentPreset();
  document.querySelectorAll('#sPresets .sBtn').forEach(b => b.classList.toggle('on', b.dataset.p === cur));
  document.querySelectorAll('#sGrid .sBtn').forEach(b => { b.lastChild.textContent = GFX_LV[b.dataset.k].names[GFX[b.dataset.k]]; });
  const need = GFX.aa !== GFX_BUILT.aa || GFX.terrain !== GFX_BUILT.terrain;
  $('sReload').style.display = need ? 'flex' : 'none';
  $('sNote').textContent = need ? 'Сглаживание краёв и детализация земли применятся после перезапуска игры'
    : (cur ? '' : 'Свои настройки') ;
}
function gfxChanged(){ gfxSave(); gfxApply(); gfxRefreshUI(); }
function gfxBuildUI(){
  const pr_ = $('sPresets'), grid = $('sGrid');
  for (const id of ['low','mid','high']){
    const b = document.createElement('button'); b.className = 'sBtn sPre'; b.dataset.p = id; b.textContent = GFX_PRESET_NAMES[id];
    b.addEventListener('click', () => { Object.assign(GFX, GFX_PRESETS[id]); gfxChanged(); });

  for (const [k, label] of GFX_ROWS){
    const b = document.createElement('button'); b.className = 'sBtn'; b.dataset.k = k;

    grid.appendChild(b);
  }
  $('sBack').addEventListener('click', gfxClose);
  $('sReload').addEventListener('click', () => {
    if (gfxFromGame && !confirm('Игра перезапустится, прогресс будет потерян. Продолжить?')) return;
    gfxSave(); location.reload();
  });
  $('btnSettings').addEventListener('click', () => gfxOpen(false));
  $('btnGfx').addEventListener('click', () => gfxOpen(true));
  gfxRefreshUI();
}

  gfxRefreshUI();

}

/* ============================================================
   УПРАВЛЕНИЕ: две независимые зоны
   ============================================================ */
const zoneMove = $('zoneMove'), zoneCam = $('zoneCam');
const joyBase = $('joyBase'), joyKnob = $('joyKnob');
const joy = { id:null, ox:0, oy:0, x:0, y:0 };
const cam = { id:null, lx:0, ly:0 };

// ЛЕВАЯ зона: динамический джойстик в точке касания
zoneMove.addEventListener('pointerdown', e => {
  if (joy.id !== null) return;
  e.preventDefault();
  try { zoneMove.setPointerCapture(e.pointerId); } catch(_){}
  joy.id = e.pointerId;
  const p = toLocal(e.clientX, e.clientY);
  joy.ox = p.x; joy.oy = p.y; joy.x = joy.y = 0;
  joyBase.style.left = (p.x-60)+'px'; joyBase.style.top = (p.y-60)+'px';
  joyBase.style.display = 'block';
  joyKnob.style.transform = 'translate(0px,0px)';
});
zoneMove.addEventListener('pointermove', e => {
  if (e.pointerId !== joy.id) return;
  e.preventDefault();
  const p = toLocal(e.clientX, e.clientY);
  let dx = p.x-joy.ox, dy = p.y-joy.oy;
  const len = Math.hypot(dx,dy);
  if (len > JOY_R){ dx = dx/len*JOY_R; dy = dy/len*JOY_R; }
  joy.x = dx/JOY_R; joy.y = dy/JOY_R;
  joyKnob.style.transform = `translate(${dx}px,${dy}px)`;
});
function joyEnd(e){
  if (e.pointerId !== joy.id) return;
  joy.id = null; joy.x = joy.y = 0; joyBase.style.display = 'none';
}
zoneMove.addEventListener('pointerup', joyEnd);
zoneMove.addEventListener('pointercancel', joyEnd);
zoneMove.addEventListener('lostpointercapture', joyEnd);

// ПРАВАЯ зона: свайп крутит камеру (работает одновременно с джойстиком)
zoneCam.addEventListener('pointerdown', e => {
  if (cam.id !== null) return;
  e.preventDefault();
  try { zoneCam.setPointerCapture(e.pointerId); } catch(_){}
  cam.id = e.pointerId;
  const p = toLocal(e.clientX, e.clientY); cam.lx = p.x; cam.ly = p.y;
});
zoneCam.addEventListener('pointermove', e => {
  if (e.pointerId !== cam.id) return;
  e.preventDefault();
  const p = toLocal(e.clientX, e.clientY);
  const dx = p.x-cam.lx, dy = p.y-cam.ly; cam.lx = p.x; cam.ly = p.y;
  camAngle -= dx*0.006;                                 // горизонтальный свайп → поворот
  camPitch = clamp(camPitch + dy*0.005, -0.2, 1.1);     // вертикальный → наклон
});
function camEnd(e){ if (e.pointerId === cam.id) cam.id = null; }

zoneCam.addEventListener('lostpointercapture', camEnd);

/* ============================================================
   ИГРОВАЯ ЛОГИКА
   ============================================================ */
function update(dt){
  gameTime += dt; MP.tick(dt);
  if (dead) return;

  // Камера с клавиатуры
  if (keys.KeyQ) camAngle += 1.8*dt;
  if (keys.KeyE) camAngle -= 1.8*dt;

  // Ввод: джойстик или WASD/стрелки
  let ix = invOpen?0:joy.x, iy = invOpen?0:joy.y;
  if (Math.hypot(ix,iy) < 0.12){ ix = 0; iy = 0; }
  const kx = (keys.KeyD||keys.ArrowRight ? 1:0) - (keys.KeyA||keys.ArrowLeft ? 1:0);
  const ky = (keys.KeyS||keys.ArrowDown  ? 1:0) - (keys.KeyW||keys.ArrowUp   ? 1:0);
  if (!invOpen && (kx || ky)){ ix = kx; iy = ky; }
  const il = Math.hypot(ix,iy);
  if (il > 1){ ix /= il; iy /= il; }

  // Пока целимся — стоим на месте, а джойстик/WASD плавно наводят прицел
  if (aiming){
    camAngle -= ix*1.3*dt;
    camPitch = clamp(camPitch + iy*0.9*dt, -0.2, 1.1);
  }
  if (aiming || throwT > 0 || drinkAnim || chop || sleeping){ ix = 0; iy = 0; }

  // Направление движения относительно камеры (вперёд = от камеры)
  const sa = Math.sin(camAngle), ca = Math.cos(camAngle);
  const wading = riverSd(player.position.x,player.position.z) < 0.3;                 // идём по воде — медленнее
  const SPD = PLAYER_SPEED * (sprintOn() ? SPRINT_MUL : 1) * (wading ? 0.6 : 1);
  let tvx = (ca*ix + sa*iy) * SPD;
  let tvz = (-sa*ix + ca*iy) * SPD;
  // Подбор: сначала подходим к предмету, потом приседаем и стоим
  if (pickAnim){
    const pdx = pickAnim.it.x - player.position.x, pdz = pickAnim.it.z - player.position.z, pd = Math.hypot(pdx,pdz);
    pickAnim.wait += dt;
    if (!pickAnim.close && pd > 0.95 && pickAnim.wait < 1.5){ tvx = pdx/pd*5; tvz = pdz/pd*5; }
    else { pickAnim.close = true; tvx = 0; tvz = 0; }
  }
  if (drinkAnim){ tvx = 0; tvz = 0; }
  const k = Math.min(1, dt*10);
  vel.x += (tvx - vel.x)*k; vel.y += (tvz - vel.y)*k;

  const pp = player.position;
  pp.x += vel.x*dt; pp.z += vel.y*dt;

  // Столкновения с деревьями: если расстояние < r + 0.5 — отталкиваем
  for (const o of obstacles){
    const dx = pp.x-o.x, dz = pp.z-o.z, d = Math.hypot(dx,dz), min = o.r + 0.5;
    if (d < min && d > 1e-4){ pp.x = o.x + dx/d*min; pp.z = o.z + dz/d*min; }
  }
  pushWalls(pp, 0.5);                                   // стены из брёвен
  // Глубокую воду озера не переходим
  { const dx = pp.x-LAKE.x, dz = pp.z-LAKE.z, d = Math.hypot(dx,dz), min = LAKE.r - 2.5;
    if (d < min && d > 1e-4){ pp.x = LAKE.x + dx/d*min; pp.z = LAKE.z + dz/d*min; } }
  // Границы мира
  pp.x = clamp(pp.x, -WORLD_LIM, WORLD_LIM); pp.z = clamp(pp.z, -WORLD_LIM, WORLD_LIM);
  pp.y = getH(pp.x, pp.z);

  // Поворот персонажа (lerp угла, dt*12)
  const speed = Math.hypot(vel.x, vel.y);
  sprintK += (((sprintOn() && speed > 1) ? 1 : 0) - sprintK) * Math.min(1, dt*6);
  let target = player.rotation.y;
  if (firstPerson) target = Math.atan2(-sa, -ca);              // в 1-м лице — за камерой
  else if (speed > 0.3) target = Math.atan2(vel.x, vel.y);     // в 3-м — в сторону движения
  if (aiming || throwT > 0) target = Math.atan2(-sa, -ca);     // при прицеливании — лицом по линии броска
  if (chop) target = Math.atan2(chop.fx - pp.x, chop.fz - pp.z);   // при ударе — лицом к цели
  if (pickAnim) target = Math.atan2(pickAnim.it.x - pp.x, pickAnim.it.z - pp.z);   // при подборе — лицом к предмету
  if (drinkAnim){ const wg=waterGrad(pp.x,pp.z); target = Math.atan2(-wg.x, -wg.z); }                  // при питье — лицом к воде
  player.rotation.y = lerpAngle(player.rotation.y, target, Math.min(1, dt*(aiming?16:12)));

  pickTick(dt); drinkTick(dt); tickChop(dt); updFall(dt); crouchK = Math.max(pickK, drinkK);
  animatePlayer(dt, gameTime, speed/PLAYER_SPEED);
  survivalUpdate(dt, pp);

  // Камера
  const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
  if (firstPerson){
    const ex = pp.x - sa*0.1, ey = pp.y + 1.72 - crouchK*0.75, ez = pp.z - ca*0.1;
    camera.position.set(ex, ey, ez);
    camera.lookAt(ex - sa*cp, ey - sp - crouchK*0.8, ez - ca*cp);   // при приседании взгляд опускается к земле
  } else {
    const D = 5.6, tx = pp.x, ty = pp.y + 1.5, tz = pp.z;
    const cx = tx + sa*cp*D, cz = tz + ca*cp*D;
    camera.position.set(cx, Math.max(ty + sp*D, getH(cx,cz) + 0.35), cz);
    camera.lookAt(tx, ty, tz);
  }

  // При прицеливании чуть приближаем (уменьшаем угол обзора)
  { const fovT = (firstPerson?72:60) - 8*aimBlend + 7*sprintK;
    if (Math.abs(camera.fov - fovT) > 0.01){ camera.fov = fovT; camera.updateProjectionMatrix(); } }

  // Тошнота: камеру покачивает
  if (sickK > 0.01){ camera.rotateZ(Math.sin(gameTime*1.3)*0.045*sickK); camera.rotateX(Math.sin(gameTime*0.9)*0.02*sickK); }
  if (coldK > 0.05) camera.rotateZ(Math.sin(gameTime*34)*.006*coldK);
  if (hurtK > 0.01){ camera.rotateZ((Math.random()-.5)*.11*hurtK); camera.rotateX((Math.random()-.5)*.07*hurtK); }
  updFPRig(dt);

  // Небо и солнце следуют за камерой; тени — за игроком
  updDayNight(dt, pp); tickWorld(dt, pp); tickWeather(dt, pp); tickNight(dt, pp); updHerds(dt, pp); tickDoors(dt); tickCook(dt); tickBerries(dt); tickExtras(dt, pp);

  // Живой мир
  grassMat.uniforms.uTime.value = gameTime;
  waterTex.offset.set(gameTime*0.012, gameTime*0.007);
}

let _lastFrameT = 0, _frameN = 0, _fpsT = 0, _fpsC = 0;
function loop(){
  requestAnimationFrame(loop);
  if (!running) return;
  const nowT = performance.now(), cap = GFX_LV.fpsCap.v[GFX.fpsCap];
  if (cap){ if (nowT - _lastFrameT < 1000/cap - 2) return; _lastFrameT = nowT; }
  let dt = clock.getDelta(); if (dt > 0.05) dt = 0.05;
  update(dt);
  if (GFX.fps){ _fpsC++; if (nowT - _fpsT >= 500){ $('fpsBox').textContent = Math.round(_fpsC*1000/(nowT-_fpsT)) + ' FPS'; _fpsC = 0; _fpsT = nowT; } }
  if (GFX.shadow === 1) renderer.shadowMap.needsUpdate = ((_frameN++) & 1) === 0;
  renderer.clear();
  renderer.render(scene, camera);
  if (firstPerson && fpScene && !dead){ renderer.clearDepth(); renderer.render(fpScene, camera); }   // руки рисуются поверх мира
  adapt(dt);
}

/* ---------- ЗВУКИ (WebAudio): зёрна шума + модальный резонанс + реверберация ---------- */
let AC=null, master, bus, NB, BN, fireG;
function audioInit(){
  if (AC){ AC.resume(); return; }
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    const comp = AC.createDynamicsCompressor(); comp.connect(AC.destination);
    master = AC.createGain(); master.gain.value = 0.8; master.connect(comp);
    bus = AC.createGain(); bus.connect(master);
    // короткая «открытая местность» — реверберация из затухающего шума
    const L = AC.sampleRate*1.4, ir = AC.createBuffer(2,L,AC.sampleRate);
    for (let c=0;c<2;c++){ const d=ir.getChannelData(c); for (let i=0;i<L;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/L,3.5); }
    const rv=AC.createConvolver(); rv.buffer=ir; const rg=AC.createGain(); rg.gain.value=.18;
    bus.connect(rv); rv.connect(rg); rg.connect(master);
    // белый и коричневый шум
    NB = AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate); BN = AC.createBuffer(1,AC.sampleRate*4,AC.sampleRate);
    const w=NB.getChannelData(0), b=BN.getChannelData(0); let br=0;
    for (let i=0;i<w.length;i++) w[i]=Math.random()*2-1;
    for (let i=0;i<b.length;i++){ br=(br+0.02*(Math.random()*2-1))/1.02; b[i]=br*3.5; }
    const loop=(f,type,q)=>{ const s=AC.createBufferSource(); s.buffer=BN; s.loop=true; const fl=AC.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=q;
      const g=AC.createGain(); g.gain.value=0; s.connect(fl); fl.connect(g); g.connect(master); s.start(); return g; };
    // ветер: два медленных «порыва»
    const wg=loop(420,'bandpass',.6); wg.gain.value=.5;
    for (const fq of [.11,.17]){ const o=AC.createOscillator(), og=AC.createGain(); o.frequency.value=fq; og.gain.value=.22; o.connect(og); og.connect(wg.gain); o.start(); }
    fireG = loop(800,'lowpass',.7);                // гул костра (громкость по расстоянию)
    (function bl(){ chirp(); setTimeout(bl,5000+Math.random()*10000); })();
  }catch(e){ AC=null; }
}
function nz(f0,f1,dur,vol,type='bandpass',q=1,dl=0){
  const t=AC.currentTime+dl, s=AC.createBufferSource(); s.buffer=NB;
  const f=AC.createBiquadFilter(); f.type=type; f.Q.value=q;
  f.frequency.setValueAtTime(f0,t); f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f); f.connect(g); g.connect(bus); s.start(t,Math.random()*1.5,dur+0.05);
}
function tn(f0,f1,dur,vol,type='sine',dl=0){
  const t=AC.currentTime+dl, o=AC.createOscillator(); o.type=type;
  o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(bus); o.start(t); o.stop(t+dur+0.02);
}
// модальный резонанс: набор затухающих синусоид (дерево, камень)
function modal(parts,vol,dl=0){ for(const [f,dec,a] of parts) tn(f*(1+(Math.random()-.5)*.05),f*.98,dec,vol*a,'sine',dl); }
// свист рассекаемого воздуха
function swoosh(vol,lo,hi,dur){
  const t=AC.currentTime, s=AC.createBufferSource(); s.buffer=NB; s.loop=true;
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.2;
  f.frequency.setValueAtTime(lo,t); f.frequency.exponentialRampToValueAtTime(hi,t+dur*.35); f.frequency.exponentialRampToValueAtTime(lo*1.3,t+dur);
  const g=AC.createGain(); g.gain.setValueAtTime(.001,t); g.gain.exponentialRampToValueAtTime(vol,t+dur*.3); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f); f.connect(g); g.connect(bus); s.start(t); s.stop(t+dur+.05);
}
function chirp(){
  if(!AC||AC.state!=='running') return;
  const base=2400+Math.random()*2200, n=2+(Math.random()*4|0);
  for(let i=0;i<n;i++) tn(base*(1+Math.random()*.3),base*(1.2+Math.random()*.4),.07,.035,'sine',i*.11);
}

    nz(900,300,.2,.08*v,'lowpass',1,.03); },
