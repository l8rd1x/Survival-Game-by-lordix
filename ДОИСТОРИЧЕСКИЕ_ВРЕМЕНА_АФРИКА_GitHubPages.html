    o.frequency.setValueAtTime(900,t); o.frequency.exponentialRampToValueAtTime(1900,t+.08); o.frequency.exponentialRampToValueAtTime(1100,t+.35);
    const v=AC.createOscillator(), vg=AC.createGain(); v.frequency.value=40; vg.gain.value=60; v.connect(vg); vg.connect(o.frequency);
    const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2200; f.Q.value=4;
    const g=AC.createGain(); g.gain.setValueAtTime(.001,t); g.gain.exponentialRampToValueAtTime(.3,t+.03); g.gain.exponentialRampToValueAtTime(.001,t+.38);
    o.connect(f); f.connect(g); g.connect(bus); o.start(t); v.start(t); o.stop(t+.4); v.stop(t+.4); },
  fire:   ()=>{ for(const d of [0,.12,.2]) modal([[3800,.02,1],[5200,.015,.6]],.3,d); nz(200,3000,.6,.3,'lowpass',1,.3); },
  gulp:   ()=>{ nz(350,120,.14,.35,'lowpass'); tn(190,110,.11,.2); nz(900,300,.08,.12,'bandpass',2,.06); },
  retch:  ()=>{ tn(120,60,.55,.28,'sawtooth'); nz(500,90,.5,.25,'lowpass',1,.05); },
  pop:    v=>{ const r=Math.random(); nz(2000+r*4000,500,.015+r*.04,.35*v+.02,'bandpass',2); if(r>.7) nz(3500,900,.02,.2*v,'highpass',1,.03); }
}).map(([k,f])=>[k,(...a)=>{ if (AC) f(...a); }]));

function updHares(dt,pp){
  for(const h of hares){
    const dx=h.x-pp.x, dz=h.z-pp.z, d=Math.hypot(dx,dz); let sp=0,mx=0,mz=0;

  }

/* ---------- ТОПОР: рубим деревья, бьём зайцев ---------- */
function findChop(pp){
  let best=null,bd=99;
  for(const t of trees){ if(t.gone) continue; const d=Math.hypot(t.x-pp.x,t.z-pp.z)-t.r; if(d<2.0&&d<bd){ bd=d; best={k:'tree',o:t,x:t.x,z:t.z}; } }
  for(const h of hares){ const d=Math.hypot(h.x-pp.x,h.z-pp.z)-.3; if(d<2.0&&d<bd){ bd=d; best={k:'hare',o:h,x:h.x,z:h.z}; } }
  { const m=crocMeleeNear(pp.x,pp.z); if(m&&m.d<1.7&&m.d<bd){ bd=m.d; best={k:'croc',o:m.c,x:m.c.x,z:m.c.z}; } }
  for(const w of wolves){ if(!wolfLive(w)) continue; const d=Math.hypot(w.x-pp.x,w.z-pp.z)-.45; if(d<1.7&&d<bd){ bd=d; best={k:'wolf',o:w,x:w.x,z:w.z}; } }
  for(const a of antAlive()){ const d=Math.hypot(a.x-pp.x,a.z-pp.z)-.5; if(d<1.8&&d<bd){ bd=d; best={k:'antelope',o:a,x:a.x,z:a.z}; } }
  return best;
}

function updFall(dt){
  for(let k=fallers.length-1;k>=0;k--){
    const f=fallers[k]; f.u+=dt/f.dur; const u=Math.min(1,f.u), e=u*u;

/* ---------- СТЕНЫ ИЗ БРЁВЕН ---------- */
function pushWalls(o,rad){
  for(const w of walls){
    if(w.open) continue;
    const dx=o.x-w.x, dz=o.z-w.z, lx=dx*w.c-dz*w.s, lz=dx*w.s+dz*w.c, ex=w.hl+rad, ez=w.ht+rad;
    if(Math.abs(lx)<ex&&Math.abs(lz)<ez){
      let nx=lx, nz=lz;
      if(ex-Math.abs(lx)<ez-Math.abs(lz)) nx=(lx<0?-1:1)*ex; else nz=(lz<0?-1:1)*ez;

function wallSpot(){
  const fx=-Math.sin(camAngle), fz=-Math.cos(camAngle), pp=player.position;
  const th=placing.th, c=Math.cos(th), s=Math.sin(th), HL=placing.door?DOOR_HL:WALL_HL, HT=placing.door?DOOR_HT:WALL_HT;
  const x=Math.round((pp.x+fx*placing.d)*2)/2, z=Math.round((pp.z+fz*placing.d)*2)/2;
  const hit=(cx,cz,r)=>{ const dx=cx-x, dz=cz-z, lx=dx*c-dz*s, lz=dx*s+dz*c;
    const qx=clamp(lx,-HL,HL), qz=clamp(lz,-HT,HT); return Math.hypot(lx-qx,lz-qz)<r; };
  const ok=!(obstacles.some(o=>hit(o.x,o.z,o.r))||walls.some(o=>Math.hypot(o.x-x,o.z-z)<(placing.door?1.7:1.4))||hit(pp.x,pp.z,.55)||

function crocSnd(kind,x,z,k=1){
  if(!AC||AC.state!=='running') return;
  const v=Math.pow(clamp(1-Math.hypot(x-player.position.x,z-player.position.z)/55,0,1),1.2)*k; if(v<.02) return;

  else if(kind==='roar'){ for(let i=0;i<3;i++) tn(170+i*22,60,.9,.2*v,'sawtooth',i*.03); nz(1300,250,.8,.35*v,'bandpass',1.5); }
  else if(kind==='snap'){ nz(3600,900,.07,.7*v,'highpass'); tn(170,60,.14,.8*v,'triangle'); modal([[520,.12,1],[1400,.07,.5]],.5*v); }
  else if(kind==='bite'){ tn(90,38,.3,.95*v,'sine'); nz(700,100,.25,.55*v,'lowpass'); nz(2500,500,.06,.4*v,'highpass'); }
  else if(kind==='splash'){ nz(1300,200,.6,.5*v,'lowpass'); nz(4200,900,.5,.25*v,'bandpass',1,.04); tn(115,50,.3,.4*v); }
  else if(kind==='lap'){ nz(2600,900,.12,.14*v,'bandpass',4); nz(900,400,.15,.08*v,'lowpass',1,.05); }
  else if(kind==='beat'){ tn(62,42,.2,.55*v,'sine'); tn(56,40,.2,.4*v,'sine',.2); }
}

function crocShade(g,top=0x1f2b14,mid=0x425230,bot=0xcdbf8a){

}

function crocMove(c,sp,dt){ c.v+=(sp-c.v)*Math.min(1,dt*(sp>c.v?5:7)); c.x+=Math.sin(c.ry)*c.v*dt; c.z+=Math.cos(c.ry)*c.v*dt; }

}
function updCroc(dt,pp){

}
function updOneCroc(c,dt,pp){
  c.t+=dt; c.hurtT=Math.max(0,c.hurtT-dt); c.biteCd=Math.max(0,c.biteCd-dt); c.roarT=Math.max(0,c.roarT-dt);

    case 'absent':

      } break;
    case 'toShore':
      crocTurn(c,c.shore.x,c.shore.z,2.1,dt); crocMove(c,1.9,dt); c.timer-=dt;
      if(crocNotices(c,pp,dist)){ startAlert(c); break; }
      if(Math.hypot(c.shore.x-c.x,c.shore.z-c.z)<.8||c.timer<=0){ c.st='drink'; c.timer=RC(10,17); c.lapT=0; crocSnd('splash',c.x,c.z,.35); }
      break;
    case 'drink':

      if(crocNotices(c,pp,dist)){ startAlert(c); break; }
      if(c.timer<=0){ c.st='toWater'; }
      break;
    case 'toWater':

      if(c.wet>.92){ c.st='swim'; c.swimT=RC(9,16); c.cycles++; c.tgt=null; crocSplash(c.x,c.z,8,.6); crocSnd('splash',c.x,c.z,.7); }

    case 'chase': {

/* --- анимация --- */
function animCroc(c,dt,pp){
  const P=c.p, a=c.an, k=Math.min(1,dt*7), wet=c.wet, st=c.st;
  const moving=c.v>.3, fast=(st==='chase'||st==='flee'||st==='bite');
  let splay=.95,hp=0,hy=0,mouth=0,tail=.16+c.v*.03,swing=moving?Math.min(.75,.28+c.v*.06):0,bw=.03+c.v*.006;
  const toP=clamp(angDiff(c.ry,Math.atan2(pp.x-c.x,pp.z-c.z)),-1,1);
  const near=Math.hypot(pp.x-c.x,pp.z-c.z)<30;
  if(st==='drink'){ splay=1.45; hp=.48; swing=0; tail=.07; bw=.01; hy=near?toP*.35:Math.sin(c.t*.6)*.2;
    const lap=Math.max(0,Math.sin(c.lapT*1.4*6.283)); mouth=.1+.16*lap; }
  else if(st==='toShore'||st==='toWater'||st==='swim'||st==='sink'){ hy=near?toP*.5:Math.sin(c.t*.7)*.2; hp=wet>.5?-.12:0; tail=.2+c.v*.05; }
  else if(st==='alert'){ splay=.55; hp=-.2; mouth=.95+.05*Math.sin(c.t*38); hy=toP; tail=.12; swing=0; }
  else if(fast){ splay=.62; hp=-.06; mouth=c.rage?.5:.22; hy=toP*.8; tail=.3; bw=.07;
    if(st==='bite'){ mouth=c.bt<(c.rage?.2:.3)?1.0:0; hy=toP; splay=.55; } }
  else if(st==='dead'){ splay=1; mouth=.7; swing=0; }
  if(c.hurtT>0){ mouth=Math.max(mouth,.85); }
  c.lunge=Math.max(0,c.lunge-dt*3.2);
  a.splay+=(splay-a.splay)*k; a.hp+=(hp-a.hp)*k; a.hy+=(hy-a.hy)*k; a.mouth+=(mouth-a.mouth)*Math.min(1,dt*(st==='bite'?30:9));
  a.tail+=(tail-a.tail)*k; a.swing+=(swing-a.swing)*k; a.bw+=(bw-a.bw)*k;
  c.ph+=dt*(fast?3.6+c.v*.42:1.7+c.v*.95); c.tph+=dt*(2.0+c.v*.8+(wet>.5?.8:0));
  let thrash=0;
  if(st==='dead'){ thrash=Math.max(0,1-c.dt/1.4); a.tail=.45*thrash+.05; a.swing=.7*thrash; c.ph+=dt*9*thrash; }
  const roll= st==='dead'? Math.PI*easeIO((c.dt-1.2)/1.6) : 0;
  // хвост и позвоночник
  P.tail.forEach((g,i)=>{ g.rotation.y=a.tail*Math.sin(c.tph-i*.62)*(.45+i*.13); });
  P.bp.rotation.y=a.bw*Math.sin(c.tph+.9)*(wet>.5?1.4:1)+(thrash?Math.sin(c.t*18)*.25*thrash:0);
  // лапы
  for(const L of P.legs){
    const ph=c.ph+L.off, hx=-Math.sin(ph)*a.swing, lift=Math.max(0,Math.cos(ph))*a.swing;
    const sp=splay0(a.splay,wet);
    L.hip.rotation.x=hx*(1-wet)+1.25*wet; L.hip.rotation.z=L.side*sp;
    L.knee.rotation.z=-L.side*(sp+lift*.55*(1-wet));
  }
  // шея и пасть
  P.neck.rotation.set(a.hp,a.hy-P.bp.rotation.y*.6,0);
  P.neck.position.z=1.0+.28*c.lunge-(st==='bite'&&!c.snapped?.12:0);
  P.jaw.rotation.x=a.mouth*.82;
  // наклон по рельефу
  const hF=c.wet>.5?c.y:getH(c.x+Math.sin(c.ry)*1.6,c.z+Math.cos(c.ry)*1.6), hB=c.wet>.5?c.y:getH(c.x-Math.sin(c.ry)*1.6,c.z-Math.cos(c.ry)*1.6);
  const pitch=c.wet>.5?(st==='sink'?.12:0):-Math.atan2(hF-hB,3.2);
  P.bp.rotation.x+=(pitch-P.bp.rotation.x)*Math.min(1,dt*5);
  // судороги при ранении и смерти
  let rz=0; if(c.hurtT>0) rz=Math.sin(c.t*45)*.1*(c.hurtT/.45); if(st==='dead') rz=roll+Math.sin(c.t*20)*.3*thrash;
  P.bp.rotation.z=rz;
  // высота корпуса: ноги стоят на земле, в воде — плывёт
  const drop=.04+.27*Math.cos(splay0(a.splay,0))+.26;
  let by=drop*(1-wet)+.40*wet; if(st==='dead') by+=(.3-by)*clamp((c.dt-1.2)/1.6,0,1);
  P.bp.position.y=by;
  P.root.position.set(c.x,c.y,c.z); P.root.rotation.y=c.ry;
  // глаза: моргание и ярость
  c.blink-=dt; if(c.blink<=0) c.blink=RC(2.5,6); const bl=c.blink<.12?.12:1;
  for(const e of P.eyes) e.scale.y=st==='dead'?.12:bl;
  if(c.rage) P.eyeM.emissive.setHex(0xff2a00);
}
function splay0(s,wet){ return s*(1-wet)+.35*wet; }

function updDayNight(dt,pp){

  const h=getH(t.x,t.z);

/* --- ИИ волков --- */
const wolfLive=w=>w.st!=='hidden'&&w.st!=='dead';
function firePos(){ const a=fires.map(f=>({x:f.x,z:f.z,r:FIRE_R})); if(TORCH.t>0){ const p=player.position; a.push({x:p.x,z:p.z,r:TORCH_R}); } return a; }
function playerSafe(pp){ return TORCH.t>0||fires.some(f=>Math.hypot(f.x-pp.x,f.z-pp.z)<SAFE_R); }
function spawnWolves(pp){
  let i=0;
  for(const w of wolves){
    let a=0,ok=false; for(let k=0;k<12&&!ok;k++){ a=Math.random()*6.283; ok=waterSd(pp.x+Math.cos(a)*52,pp.z+Math.sin(a)*52)>4; }
    w.x=clamp(pp.x+Math.cos(a)*(50+i*6),-WORLD_LIM+4,WORLD_LIM-4); w.z=clamp(pp.z+Math.sin(a)*(50+i*6),-WORLD_LIM+4,WORLD_LIM-4); w.ry=a+Math.PI;
    w.hp=WOLF_HP; w.st='prowl'; w.v=0; w.ang=Math.atan2(w.z-pp.z,w.x-pp.x); w.dir=i%2?1:-1; w.R=RC(15,21); w.biteCd=0; w.rushDelay=2.5+i*2.5; w.p.root.visible=true; w.t=0; w.exp=0; i++;
  }
  if(!wolfMsg){ wolfMsg=true; toast('🐺 С наступлением ночи где-то воют волки… Держись у костра'); }
}
function hitWolf(w,dmg,head){
  if(!wolfLive(w)) return;
  w.hp-=dmg*(head?1.4:1); w.hurtT=.35; wolfSnd('yelp',w.x,w.z,1.2); SND.hit();
  if(w.hp<=0){ w.st='dead'; w.dt=0; w.v=0; const fx=Math.sin(w.ry), fz=Math.cos(w.ry);
    spawnItem('meat',w.x+fz*.5,w.z-fx*.5); spawnItem('meat',w.x-fz*.5,w.z+fx*.5); toast('🐺 Волк убит! Выпало 2 куска мяса'); return; }
  w.st='flee'; w.fleeT=6; toast(head?'Попал волку в голову!':'Волк ранен и бежит');
}
function wolfHitAt(p){
  for(const w of wolves){ if(!wolfLive(w)) continue;
    if(p.y<.05||p.y>1.1) continue;
    const fx=Math.sin(w.ry), fz=Math.cos(w.ry), s=segNear(p.x,p.z,w.x-fx*.6,w.z-fz*.6,w.x+fx*.75,w.z+fz*.75);
    if(s.d<.4) return {w,head:s.t>.8}; }

}
function wolfBite(w,pp){
  const dx=pp.x-w.x, dz=pp.z-w.z, d=Math.hypot(dx,dz)||1;
  ST.hp-=11; hurtK=.9; SND.hit(); pp.x+=dx/d*.7; pp.z+=dz/d*.7; toast('🐺 Волк укусил! −11 здоровья');
  if(ST.hp<=0){ ST.hp=0; die(); $('dead').firstElementChild.textContent='ВАС ЗАГРЫЗЛИ ВОЛКИ'; }
}
function updWolves(dt,pp){
  const day=dayK>.45, night=dayK<.28;
  if(dayK>.65) wolfSpawned=false;
  if(night&&!wolfSpawned&&!dead){ wolfSpawned=true; spawnWolves(pp); }
  const safe=playerSafe(pp), zones=firePos();
  howlT-=dt;
  let exp=wolves.some(w=>wolfLive(w))&&!safe;
  for(const w of wolves){
    if(w.st==='hidden') continue;
    w.t+=dt; w.hurtT=Math.max(0,w.hurtT-dt); w.biteCd=Math.max(0,w.biteCd-dt); w.rushDelay-=dt;
    const dx=pp.x-w.x, dz=pp.z-w.z, dist=Math.hypot(dx,dz);
    if(w.st==='dead'){ w.dt+=dt; if(w.dt>40){ w.st='hidden'; w.p.root.visible=false; } animWolf(w,dt,pp); continue; }
    if(day&&w.st!=='leave'){ w.st='leave'; w.leaveT=0; }
    if(dead&&(w.st==='rush'||w.st==='bite')) w.st='prowl';
    switch(w.st){
      case 'prowl': {
        w.exp=exp?(w.exp||0)+dt:Math.max(0,(w.exp||0)-dt*2);
        w.ang+=w.dir*dt*.22; const tx=pp.x+Math.cos(w.ang)*w.R, tz=pp.z+Math.sin(w.ang)*w.R, td=Math.hypot(tx-w.x,tz-w.z);
        wolfTurn(w,tx,tz,4.5,dt); wolfMove(w,td>3?(td>12?7:4.6):1.4,dt);
        if(w.exp>28&&w.rushDelay<=0&&!safe&&dist<34&&!sleeping||(w.exp>28&&sleeping&&!safe&&dist<30&&w.rushDelay<=0)){ w.st='rush'; w.t=0; wolfSnd('growl',w.x,w.z,1); }
        if(howlT<=0&&dist>14){ howlT=RC(22,40); w.st='howl'; w.howlT=2.6; wolfSnd('howl',w.x,w.z,1); }
        break; }
      case 'howl': w.howlT-=dt; wolfMove(w,0,dt); if(w.howlT<=0) w.st='prowl'; break;
      case 'rush':
        wolfTurn(w,pp.x,pp.z,6,dt); wolfMove(w,safe?5:(w.t<1.2?10:8.6),dt);
        if(safe||w.t>11){ w.st='prowl'; w.exp=0; w.rushDelay=RC(4,9); break; }
        if(w.biteCd<=0&&dist<1.9&&!dead){ w.st='bite'; w.bt=0; w.snapped=false; }
        break;
      case 'bite':
        w.bt+=dt; wolfTurn(w,pp.x,pp.z,4,dt); wolfMove(w,w.bt<.2?3:5,dt);
        if(!w.snapped&&w.bt>=.2){ w.snapped=true; wolfSnd('snap',w.x,w.z,1); if(dist<2.1&&!dead) wolfBite(w,pp); }
        if(w.bt>=.45){ w.st='retreat'; w.fleeT=1.6; w.biteCd=3; for(const o of wolves) o.biteCd=Math.max(o.biteCd,1.8); }
        break;
      case 'retreat': w.fleeT-=dt; wolfTurn(w,w.x-dx,w.z-dz,6,dt); wolfMove(w,6,dt); if(w.fleeT<=0){ w.st='prowl'; w.exp=22; w.rushDelay=RC(3,6); } break;
      case 'flee': w.fleeT-=dt; wolfTurn(w,w.x-dx,w.z-dz,7,dt); wolfMove(w,9,dt); if(w.fleeT<=0){ w.st='prowl'; w.exp=0; w.rushDelay=RC(6,12); } break;
      case 'leave': {
        w.leaveT+=dt; const ax=w.x-pp.x, az=w.z-pp.z; wolfTurn(w,w.x+ax,w.z+az,4,dt); wolfMove(w,7,dt);
        if(dist>85||w.leaveT>25){ w.st='hidden'; w.p.root.visible=false; w.hp=WOLF_HP; }
        break; }
    }
    // отпугивание огнём, стены, деревья, озеро
    for(const z of zones){ const d=Math.hypot(w.x-z.x,w.z-z.z); if(d<z.r&&d>1e-4){ w.x=z.x+(w.x-z.x)/d*z.r; w.z=z.z+(w.z-z.z)/d*z.r; if(w.st==='rush') { w.st='prowl'; w.exp=0; w.rushDelay=RC(3,7); } } }
    for(const o of obstacles){ const ox=w.x-o.x, oz=w.z-o.z, od=Math.hypot(ox,oz), mn=o.r+.55; if(od<mn&&od>1e-4){ w.x=o.x+ox/od*mn; w.z=o.z+oz/od*mn; } }
    pushWalls(w,.5);
    pushWater(w,.6);
    if(w.st!=='bite'&&dist<.8&&dist>1e-4){ w.x=pp.x-dx/dist*.8; w.z=pp.z-dz/dist*.8; }
    w.x=clamp(w.x,-WORLD_LIM,WORLD_LIM); w.z=clamp(w.z,-WORLD_LIM,WORLD_LIM);
    animWolf(w,dt,pp);
  }
}
function wolfTurn(w,tx,tz,rate,dt){ w.ry+=clamp(angDiff(w.ry,Math.atan2(tx-w.x,tz-w.z)),-rate*dt,rate*dt); }
function wolfMove(w,sp,dt){ w.v+=(sp-w.v)*Math.min(1,dt*(sp>w.v?6:8)); w.x+=Math.sin(w.ry)*w.v*dt; w.z+=Math.cos(w.ry)*w.v*dt; }
function animWolf(w,dt,pp){
  const P=w.p, a=w.an, k=Math.min(1,dt*8), st=w.st, run=w.v>5.5, moving=w.v>.4;
  let swing=moving?Math.min(.8,.25+w.v*.07):0, hp=0, mouth=0, tail=.25;
  if(st==='howl'){ hp=-.8; mouth=.45+.05*Math.sin(w.t*30); swing=0; tail=.1; }
  else if(st==='rush'||st==='bite'||st==='retreat'){ hp=.05; mouth=st==='bite'?(w.bt<.2?1:0):.35; tail=.45; }
  else if(st==='prowl'){ hp=.12; tail=.2; }
  if(w.hurtT>0) mouth=.9;
  a.swing+=(swing-a.swing)*k; a.hp+=(hp-a.hp)*k; a.mouth+=(mouth-a.mouth)*Math.min(1,dt*(st==='bite'?30:10)); a.tail+=(tail-a.tail)*k;
  w.ph+=dt*(run?13:5+w.v*.9);
  const gy=getH(w.x,w.z);
  P.legs.forEach(L=>{ const ph=w.ph+L.off; L.hip.rotation.x=-Math.sin(ph)*a.swing; L.knee.rotation.x=Math.max(0,Math.cos(ph))*a.swing*1.1; });
  P.bp.rotation.x=(run?Math.sin(w.ph*2)*.07:0)+(st==='howl'?-.12:0);
  P.bp.rotation.y=Math.sin(w.ph)*.05*a.swing;
  P.bp.position.y=.68+(run?Math.abs(Math.sin(w.ph))*.06:0);
  P.neck.rotation.set(a.hp,0,0); P.jaw.rotation.x=a.mouth*.7;
  const tw=w.t*(run?9:3); P.tail.rotation.y=Math.sin(tw)*a.tail; P.tail2.rotation.y=Math.sin(tw-.8)*a.tail*.8; P.tail3.rotation.y=Math.sin(tw-1.6)*a.tail*.7;
  P.tail.rotation.x=-.5+(run?.35:0)+(st==='howl'?.2:0);
  let rz=0, py=gy; if(st==='dead'){ rz=Math.PI/2*clamp(w.dt/.5,0,1); P.bp.position.y=.2+.48*(1-clamp(w.dt/.5,0,1)); P.legs.forEach(L=>{ L.hip.rotation.x=.4; }); if(w.dt>34) py-= (w.dt-34)*.1; for(const e of [P.eyeM]) e.emissiveIntensity=0; }
  else P.eyeM.emissiveIntensity=2.2;
  P.bp.rotation.z=rz;
  P.root.position.set(w.x,py,w.z); P.root.rotation.y=w.ry;
}

function tickSleep(dt,pp){

  const wolfNear=wolves.some(w=>wolfLive(w)&&w.st!=='leave'&&Math.hypot(w.x-pp.x,w.z-pp.z)<16);
  if(dayK>.6) wakeUp('☀️ Ты выспался. Наступило утро');

  else if(ST.hp<sleepHp-.5||dead) wakeUp('Что-то разбудило тебя');

}

/* --- ночные звуки --- */
function tickNightSnd(dt){
  if(!AC||AC.state!=='running'||dayK>.3) return;
  nightSndT-=dt; owlT-=dt;
  if(nightSndT<=0){ nightSndT=RC(1.2,3.2); const f=RC(3900,4700), v=RC(.025,.045); for(let i=0;i<4;i++) tn(f,f*1.02,.045,v,'square',i*.085); }

}

/* --- общий тик + возрождение предметов на месте --- */
function tickNight(dt,pp){
  tickWarmth(dt,pp); tickTorch(dt,pp); tickSleep(dt,pp); updWolves(dt,pp); tickNightSnd(dt);
  slpUi-=dt; if(slpUi<=0){ slpUi=.3;
    const can=!sleeping&&!dead&&dayK<.4&&fires.some(f=>Math.hypot(f.x-pp.x,f.z-pp.z)<5)&&!wolves.some(w=>wolfLive(w)&&w.st!=='leave'&&Math.hypot(w.x-pp.x,w.z-pp.z)<28);
    const b=$('bSleep'); if(b._on!==can){ b._on=can; b.style.display=can?'flex':'none'; } }
  for(let k=homeQ.length-1;k>=0;k--){ const e=homeQ[k]; if(gameTime<e.t) continue;
    if(spotFree(e.x,e.z,pp,5)){ const it=spawnItem(e.type,e.x,e.z); it.home=true; it.g.scale.setScalar(.01); popIn.push({g:it.g,u:0}); homeQ.splice(k,1); }

function spawnHerd(pp,n=3){
  let x=0,z=0;

/* ---------- БРОСОК: копьё (по умолчанию) и палки ---------- */
const DMG={stick:1,sharp:2,spear:3};
let _btnTxt='';
function updThrowBtn(){ const ax=hasAxe(), sp=hasSpear(); const t = ax&&sp ? '⚔️' : sp ? '🔱' : ax ? '🪓' : '🎯'; if(t!==_btnTxt){ _btnTxt=t; $('bThrow').textContent=t; } }

/* ---------- ПРИЦЕЛИВАНИЕ: держим кнопку — целимся, отпускаем — бросок ---------- */
const spreadOf = c => 0.004 + 0.14*Math.pow(1-c,1.6);          // разброс (рад): чем дольше держишь, тем он меньше
const THROW_SPEED = t => t==='spear' ? 24 : 20;
function aimDir(out){
  const sa=Math.sin(camAngle), ca=Math.cos(camAngle);
  if(firstPerson){ const cp=Math.cos(camPitch); return out.set(-sa*cp,-Math.sin(camPitch),-ca*cp).normalize(); }
  return out.set(-sa,0.05-(camPitch-.35)*.6,-ca).normalize();
}
function aimOrigin(dir,out){ const pp=player.position; return out.set(pp.x+dir.x*.6,pp.y+1.2,pp.z+dir.z*.6); }
// предсказание точки падения — та же физика, что у updProj
function simLanding(type,origin,dir){
  const p=origin.clone(), v=dir.clone().multiplyScalar(THROW_SPEED(type)), dt=1/50; let t=0;
  while(t<4){
    t+=dt; v.y-=7*dt;
    for(let s=0;s<2;s++){
      p.addScaledVector(v,dt/2);
      for(const h of hares) if(Math.hypot(h.x-p.x,h.z-p.z)<.7&&Math.abs(p.y-(h.g.position.y+.3))<1.1) return p;
      const gy=getH(p.x,p.z);
      if(p.y<=gy+.05) return p;
      for(const o of obstacles) if(p.y<gy+2&&Math.hypot(p.x-o.x,p.z-o.z)<o.r+.1) return p;
    }
  }
  return p;
}
function startAim(){

  let type;
  if(hasSpear()) type='spear';
  else { const i=inv.find(o=>o.type==='stick')||inv.find(o=>o.type==='sharp');
    if(!i){ if(hasAxe()) return; toast('Нечем бросать — подбери палку или сделай топор/копьё (🎒 → 🔨)'); SND.fail(); return; } type=i.type; }
  aiming=true; aimT=0; aimType=type; aimSimN=0;
  P.held.visible = type!=='spear'; P.held.children[1].visible = type==='sharp';
  $('aimBar').style.display='block'; $('aimFill').style.width='0%';
  if(aimMark) aimMark.visible=true;

}
function endAimUI(){

}

function releaseAim(){
  if(!aiming) return;
  const type=aimType, c=clamp(aimT/AIM_MAX,0,1);
  endAimUI();
  let dur;
  { const i=inv.find(o=>o.type===type); if(!i) return; dur=i.dur; inv.splice(inv.indexOf(i),1); }
  updThrowBtn();
  relCharge=c; cd=.6; throwT=.35; SND.throw(type==='spear');
  // направление прицела + случайное отклонение внутри конуса разброса
  const dir=aimDir(new THREE.Vector3()), origin=aimOrigin(dir,new THREE.Vector3());
  const sp=spreadOf(c), r=sp*Math.sqrt(Math.random()), a=Math.random()*Math.PI*2;
  const right=new THREE.Vector3().crossVectors(dir,new THREE.Vector3(0,1,0)).normalize();
  const upv=new THREE.Vector3().crossVectors(right,dir);
  dir.addScaledVector(right,Math.cos(a)*r).addScaledVector(upv,Math.sin(a)*r).normalize();
  const g=mkItemMesh(type,true); scene.add(g);

}
function updAim(dt){

function updProj(dt){
  for(let k=projs.length-1;k>=0;k--){
    const q=projs[k]; q.t+=dt; q.v.y-=7*dt;
    let done=false, why='';
    for(let s=0;s<2&&!done;s++){
      q.p.addScaledVector(q.v,dt/2);
      { const ch=crocHitAt(q.p); if(ch){ hitCroc(ch.c,DMG[q.type],ch.head); done=true; why='croc'; break; } }
      { const wi=wolfHitAt(q.p); if(wi){ hitWolf(wi.w,DMG[q.type],wi.head); done=true; why='wolf'; break; } }
      { const ai=antHitAt(q.p); if(ai){ hitAntelope(ai.a,DMG[q.type],ai.head); done=true; why='antelope'; break; } }
      for(const h of hares) if(Math.hypot(h.x-q.p.x,h.z-q.p.z)<.7&&Math.abs(q.p.y-(h.g.position.y+.3))<1.1){ hitHare(h,DMG[q.type]); done=true; why='hare'; break; }
      if(done) break;
      const gy=getH(q.p.x,q.p.z);
      if(q.p.y<=gy+.05){ done=true; why='ground'; break; }
      for(const o of obstacles) if(q.p.y<gy+2&&Math.hypot(q.p.x-o.x,q.p.z-o.z)<o.r+.1){ done=true; why='obst'; q.o=o; break; }
    }
    q.g.position.copy(q.p); q.g.quaternion.setFromUnitVectors(AX,tmpV.copy(q.v).normalize());
    if(done||q.t>4){
      scene.remove(q.g); projs.splice(k,1);
      let x=q.p.x, z=q.p.z;
      if(why==='obst'){ const o=q.o, dx=x-o.x, dz=z-o.z, d=Math.hypot(dx,dz)||1; x=o.x+dx/d*(o.r+.4); z=o.z+dz/d*(o.r+.4); }
      x=clamp(x,-WORLD_LIM,WORLD_LIM); z=clamp(z,-WORLD_LIM,WORLD_LIM);
      if(waterSd(x,z)<1&&!(riverSd(x,z)<1&&fordK(z)>.5&&lakeSd(x,z)>1)){ const o={x,z}; pushWater(o,1.2); x=o.x; z=o.z; toast('Упало в воду — лежит у берега'); }
      // износ копья: каждый бросок −1, удар о дерево/камень −3 и 25% шанс сломаться сразу
      let broke=false, dur=q.dur;
      if(q.type==='spear'){
        dur=(dur??SPEAR_DUR)-(why==='obst'?3:why==='croc'?2:1);
        if(why==='obst'&&Math.random()<.25) dur=0;
        if(dur<=0) broke=true;
      }
      if(q.type==='sharp'&&(why==='hare'||why==='croc'||why==='wolf'||why==='antelope')){
        spawnItem('stick',x,z); SND.clack(); toast('Заточенная палка сломалась о цель');
      } else
      if(broke){ spawnItem('stick',x,z); SND.clack(); toast('Копьё сломалось! Остался только обломок древка'); }
      else{
        spawnItem(q.type,x,z,Math.atan2(-q.v.z,q.v.x),dur);
        if(why!=='hare'&&why!=='croc'&&why!=='wolf'&&why!=='antelope') (q.type==='spear'?SND.stuck:SND.clack)();
        if(q.type==='spear'&&dur<=2) toast('Копьё скоро сломается');
      }
    }
  }
}

function silentFell(t,rem){

    Object.assign(ST,S.st); inv=S.inv||[]; invId=S.invId||(inv.reduce((m,o)=>Math.max(m,o.id),0)+1);
    dayH=S.dayH??9; gameTime=S.gameTime||0; TORCH.t=S.torch||0;

    camAngle=S.p.cam??camAngle; camPitch=S.p.pitch??camPitch; vel.set(0,0);

      const c=Math.cos(w.th), s=Math.sin(w.th), g=w.door?mkDoorMesh():mkWallMesh();

      if(w.door){ g.userData.leaf.rotation.y=w.a; walls.push({x:w.x,z:w.z,c,s,hl:DOOR_HL,ht:DOOR_HT,door:true,open:w.open,isOpen:w.open,leaf:g.userData.leaf,ang:w.a,tAng:w.a}); }

    cancelAim(); cancelPlace(); updThrowBtn(); setBar('Hp',ST.hp); setBar('Food',ST.food); setBar('Water',ST.water);
    return true;
  }catch(err){ console.error(err); return false; }
}

  };
  room.presence = data => setDoc(doc(window.__lordixDb,'rooms','africa','players',uid),{...data,updatedAt:Date.now()});
  // Закрытие вкладки удаляет присутствие, чтобы ушедшие игроки исчезали.
  addEventListener('pagehide',()=>{ try{deleteDoc(doc(window.__lordixDb,'rooms','africa','players',uid));}catch(e){} },{once:true});
  applySkin();
  try{ const s=await db.doc('world/clock').get(); if(s.exists){ clk=s.data(); gameTime=clk.gt||0; dayH=clk.dh??dayH; } }catch(e){}
  if(uid){ try{ const s=await col('data/users/'+uid).doc('me').get(); if(s.exists){ const S=s.data();
    Object.assign(ST,S.st||{}); inv=JSON.parse(JSON.stringify(S.inv||[])); invId=S.invId||(inv.reduce((m,o)=>Math.max(m,o.id),0)+1); TORCH.t=S.torch||0;
    if(S.p){ player.position.set(S.p.x,getH(S.p.x,S.p.z),S.p.z); player.rotation.y=S.p.ry||0; }
    setBar('Hp',ST.hp); setBar('Food',ST.food); setBar('Water',ST.water); updThrowBtn(); } }catch(e){ console.warn(e); } }
  const sub=(name,fn)=>col(name).onSnapshot(sn=>{ for(const ch of sn.docChanges()) try{ fn(ch.type,ch.doc.id,ch.doc.data()); }catch(e){ console.warn(e); } });
  for(const it of items) if(it.mpId) itemById.set(it.mpId,it);
  sub('walls',(t,id,d)=>{ if(t==='added') addWall(id,d); else if(t==='modified'){ const o=wallById.get(id); if(o&&o.door&&o.isOpen!==!!d.open){ o.isOpen=o.open=!!d.open; o.tAng=d.open?(d.a||1.75):0; } } });
  sub('fires',(t,id,d)=>{ if(t==='added') addFire(id,d); else if(t==='removed') delFire(id); });
  sub('trees',(t,id,d)=>{ if(t==='removed') treeDocs.delete(id); else tree(id,d); });
  sub('taken',(t,id)=>{ if(t==='added'){ const it=items.find(i=>i.mpId===id); itemById.delete(id); dropLocal(it); } });
  sub('items',(t,id,d)=>{
    if(t==='added'){ if(itemById.has(id)) return; MP.mute=true;
      try{ const it=spawnItem(d.type,d.x,d.z,d.ry,d.dur==null?undefined:d.dur); it.mpId=id; if(d.home) it.home=true; itemById.set(id,it); }finally{ MP.mute=false; } }
    else if(t==='removed'){ const it=itemById.get(id); itemById.delete(id); dropLocal(it); } });
  db.doc('world/clock').onSnapshot(s=>{ if(s.exists) clk=s.data(); });
  room.onPeers(ch=>{
    const seen=new Set();
    for(const p of ch.peers){ if(p.isMe||!p.presence||p.presence.x==null) continue; seen.add(p.peer);
      let a=avs.get(p.peer); const n=String(p.presence.n||'Игрок');
      if(!a){ a={...mkPeer(n,p.presence.k),n}; a.g.position.set(p.presence.x,0,p.presence.z); avs.set(p.peer,a); if(!first) toast('👤 '+n+' зашёл в мир'); }
      a.x=p.presence.x; a.z=p.presence.z; a.ry=p.presence.ry||0; }
    for(const [k,a] of avs) if(!seen.has(k)){ scene.remove(a.g); avs.delete(k); toast('👤 '+a.n+' вышел'); }
    first=false; MP.count=avs.size+1;
  });
  setInterval(()=>{if(MP.on&&player){const pp=player.position;bg(room.presence({x:+pp.x.toFixed(2),z:+pp.z.toFixed(2),ry:+player.rotation.y.toFixed(2),n:nameMe,k:skinK}));}},250);
  bg(room.presence({x:+player.position.x.toFixed(2),z:+player.position.z.toFixed(2),ry:+player.rotation.y.toFixed(2),n:nameMe,k:skinK}));
  MP.on=true;
};
addEventListener('pagehide',()=>{ if(MP.on) saveProfile(); });
document.addEventListener('visibilitychange',()=>{ if(MP.on&&document.hidden) saveProfile(); });
$('btnMulti').addEventListener('click',()=>showMenuView('multi'));
$('btnBackMulti').addEventListener('click',()=>showMenuView(false));
let mpSkin='d'; const setSk=k=>{ mpSkin=k; $('skD').style.outline=k==='d'?'4px solid #ffd27a':'none'; $('skL').style.outline=k==='l'?'4px solid #ffd27a':'none'; };
$('skD').addEventListener('click',()=>setSk('d')); $('skL').addEventListener('click',()=>setSk('l'));
try{ const sv=JSON.parse(localStorage.getItem('lordix_mp')||'null'); if(sv){ $('mpNick').value=sv.n||''; mpSkin=sv.k==='l'?'l':'d'; } }catch(e){}
setSk(mpSkin);
for(const ev of ['keydown','keyup']) $('mpNick').addEventListener(ev,e=>e.stopPropagation());
{ const f=sessionStorage.getItem('lordix_menu'); if(f){ sessionStorage.removeItem('lordix_menu'); setTimeout(()=>showMenuView(f==='multi'?'multi':true),0); } }
$('btnServer').addEventListener('click',async()=>{
  if(!ready) return;
  if(MP.on&&sessionLive){ enterGame(); return; }
  if(sessionLive){ sessionStorage.setItem('lordix_menu','multi'); location.reload(); return; }
  const nk=($('mpNick').value||'').trim().slice(0,14);
  if(nk.length<2){ $('loadMsg').textContent='Введите ник (от 2 символов)'; return; }
  MP.setProfile(nk,mpSkin); try{ localStorage.setItem('lordix_mp',JSON.stringify({n:nk,k:mpSkin})); }catch(e){}
  $('loadMsg').textContent='Подключение к серверу…';
  try{ await MP.connect(); }catch(e){ console.error(e); $('loadMsg').textContent=e.message||'Не удалось подключиться'; return; }
  $('loadMsg').textContent=''; enterGame(); toast('🌍 Вы на общем сервере');
});
})();

// Строим мир во время заставки
setTimeout(init, 150);
layout();
</script>
</body>
